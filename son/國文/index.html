<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三上國語期中複習</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="國語複習">
<meta name="theme-color" content="#2f7d5b">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%232f7d5b'/%3E%3Ctext x='90' y='122' font-size='100' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E8%AA%9E%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f4ee;--card:#ffffff;--ink:#22302a;--muted:#66736c;--line:#e2ddd2;
  --brand:#2f7d5b;--brand-soft:#e3f1e9;--ok:#2f8f4e;--ok-soft:#e2f4e6;--bad:#c2463d;--bad-soft:#fbe6e3;
  --star:#e3a20b;--chip:#efece4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a17;--card:#1f2622;--ink:#eef2ee;--muted:#a5b1aa;--line:#2f3833;
    --brand:#5cc196;--brand-soft:#21362c;--ok:#5fcf84;--ok-soft:#1d3426;--bad:#f0827a;--bad-soft:#3a2321;
    --star:#f4c04a;--chip:#29312c;
  }
}
:root[data-theme="dark"]{
  --bg:#151a17;--card:#1f2622;--ink:#eef2ee;--muted:#a5b1aa;--line:#2f3833;
  --brand:#5cc196;--brand-soft:#21362c;--ok:#5fcf84;--ok-soft:#1d3426;--bad:#f0827a;--bad-soft:#3a2321;
  --star:#f4c04a;--chip:#29312c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
header h1{font-size:22px;margin:0}
.stars{font-weight:700;color:var(--star);white-space:nowrap}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{border:0;background:none;color:var(--muted);font-size:15px;padding:6px 0;border-radius:10px;font-family:inherit}
nav.tabs button .i{display:block;font-size:22px;line-height:1.2}
nav.tabs button{position:relative}
.badge{position:absolute;top:2px;left:50%;margin-left:8px;background:var(--bad);color:#fff;font-size:11px;line-height:16px;min-width:18px;padding:0 4px;border-radius:9px;font-weight:700}
nav.tabs button.on{color:var(--brand);background:var(--brand-soft);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h2{font-size:19px;margin:0 0 8px}
.muted{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:16px;font-family:inherit;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lessons{display:grid;grid-template-columns:1fr;gap:8px}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--chip)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--brand)}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:4px}
.qtext{font-size:23px;font-weight:700;margin:10px 0 14px;line-height:1.5}
.qtext .hl{color:var(--brand);text-decoration:underline;text-underline-offset:5px}
.big{font-size:44px;letter-spacing:4px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:21px;font-family:inherit;cursor:pointer;min-height:56px}
.opt .k{flex:0 0 30px;height:30px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--brand);background:var(--brand-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:17px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.nav2{display:flex;gap:8px;margin-top:14px}
.nav2 .btn{flex:1;font-size:16px;padding:12px 6px;white-space:nowrap}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
textarea{width:100%;min-height:90px;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px;font-family:monospace}
.hide{display:none}
.result{text-align:center}
.result .score{font-size:56px;font-weight:800;color:var(--brand)}
.kbd{font-size:13px;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:16px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
/* 寵物 */
.petStage{text-align:center;padding:10px 0 4px;position:relative;min-height:190px}
.petEmoji{display:inline-block;line-height:1.1;cursor:pointer;user-select:none;transition:font-size .4s}
.petEmoji.bounce{animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
.petDeco{font-size:26px;letter-spacing:6px;min-height:34px}
.bubble{display:inline-block;background:var(--chip);border-radius:16px;padding:6px 14px;font-size:17px;margin-top:6px;max-width:100%}
.heart{position:absolute;left:50%;top:40%;font-size:28px;pointer-events:none;animation:float 1.2s ease-out forwards}
@keyframes float{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-120px)}}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;font-family:inherit;font-size:16px;cursor:pointer;text-align:center}
.food .fe{font-size:34px;display:block}
.food[disabled]{opacity:.45;cursor:default}
.wallet{display:flex;justify-content:space-around;text-align:center;gap:8px}
.wallet b{display:block;font-size:26px;color:var(--star)}
.petPick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.petPick button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:4px 0 6px;cursor:pointer;color:var(--ink);font-family:inherit}
.petPick button svg{width:100%;max-width:96px;height:auto;display:block;margin:0 auto}
.pickKind{font-weight:700;margin:12px 0 6px}
.petEmoji svg{display:block;width:100%;height:auto}
#petTabIcon svg{width:26px;height:26px;display:block;margin:0 auto}
.petPick button small{display:block;font-size:15px}
.petPick button.on{border-color:var(--brand);background:var(--brand-soft)}
input.txt{width:100%;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
/* 翻牌 */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:480px){.board{grid-template-columns:repeat(4,1fr)}}
.cardf{aspect-ratio:1/1;border-radius:14px;border:2px solid var(--line);background:var(--brand);color:#fff;font-size:30px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.2}
.cardf.zy{font-size:22px}
.cardf.up{background:var(--card);color:var(--ink)}
.cardf.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.cardf.miss{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.reward{padding:10px 12px;border-radius:12px;background:var(--chip);margin-bottom:8px}
.reward.ready{background:var(--ok-soft);border:2px solid var(--ok)}
.gate{margin-top:10px;padding:12px;border-radius:12px;background:var(--chip)}
.confetti{position:fixed;top:-20px;font-size:24px;pointer-events:none;z-index:20;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📗 三上國語複習</h1>
    <div class="row"><span class="stars" id="starCount">⭐ 0</span><button class="chip" id="themeBtn" aria-label="切換深淺色">🌓</button></div>
  </header>

  <!-- 首頁 -->
  <section id="v-home">
    <div class="card">
      <h2>加油！期中考第 1～6 課</h2>
      <div class="muted">答對一題得 1 顆星（同一題一天拿一次），可以到「寵物」餵寵物、玩翻牌遊戲。答錯的題目會放進「不熟」，再答對就會移出。</div>
    </div>
    <div class="card">
      <h2>各課進度</h2>
      <div class="lessons" id="lessonList"></div>
    </div>
    <div class="card">
      <h2>題型進度</h2>
      <div class="lessons" id="typeList"></div>
    </div>
    <div class="card">
      <h2>給家長</h2>
      <div class="muted" id="parentNote"></div>
      <div id="weakLessons" style="margin-top:8px"></div>
      <div style="margin-top:12px"><button class="btn ghost" id="rewardSetBtn">🎁 設定實體獎勵</button></div>
      <div id="rewardEditor"></div>
      <div class="muted" style="margin-top:10px">題目都是依課文整理後由 AI 出的模擬題（標「AI 模擬」），各課生字以網路上公開的課文資料整理，可能和課本的生字表有出入，請以課本和習作為準。</div>
    </div>
    <div class="card">
      <h2>備份紀錄（換手機用）</h2>
      <div class="row">
        <button class="btn ghost" id="exportBtn">複製備份碼</button>
        <button class="btn ghost" id="copyWrongBtn">複製錯題清單</button>
      </div>
      <textarea id="importBox" placeholder="把備份碼貼在這裡，再按「匯入」" style="margin-top:10px"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" id="importBtn">匯入</button>
        <button class="btn ghost" id="resetBtn">清除全部紀錄</button>
      </div>
    </div>
  </section>

  <!-- 練習 -->
  <section id="v-practice" class="hide">
    <div id="pSetup">
      <div class="card">
        <h2>選課</h2>
        <div class="chips" id="pLessons"></div>
      </div>
      <div class="card">
        <h2>選題型</h2>
        <div class="chips" id="pTypes"></div>
      </div>
      <div class="card">
        <h2>出題順序</h2>
        <div class="chips" id="pOrder"></div>
        <div style="margin-top:14px"><button class="btn wide" id="pStart">開始練習 ▶</button></div>
        <div class="muted" id="pCount" style="margin-top:6px"></div>
      </div>
    </div>
    <div id="pRun" class="hide"></div>
  </section>

  <!-- 不熟 -->
  <section id="v-weak" class="hide"><div id="wRun"></div></section>

  <!-- 模擬考 -->
  <section id="v-exam" class="hide">
    <div id="eSetup">
      <div class="card">
        <h2>模擬考範圍</h2>
        <div class="chips" id="eLessons"></div>
      </div>
      <div class="card">
        <h2>考試方式</h2>
        <div class="chips" id="eMode"></div>
        <div class="muted" id="eModeNote" style="margin-top:6px"></div>
      </div>
      <div class="card" id="eNumCard">
        <h2>題數</h2>
        <div class="chips" id="eNum"></div>
      </div>
      <div class="card">
        <button class="btn wide" id="eStart">開始考試 📝</button>
        <div class="muted" style="margin-top:6px">全部寫完再交卷，交卷後一起對答案，錯的題目會放進「不熟」。每次都會優先抽之前沒考過的題目，選項順序也會重新洗牌。</div>
      </div>
    </div>
    <div id="eRun" class="hide"></div>
  </section>

  <!-- 寵物 -->
  <section id="v-pet" class="hide"><div id="petHost"></div></section>
</div>

<nav class="tabs">
  <button data-v="home" class="on"><span class="i">🏠</span>首頁</button>
  <button data-v="practice"><span class="i">✏️</span>練習</button>
  <button data-v="weak"><span class="i">🔁</span>不熟<span id="weakBadge"></span></button>
  <button data-v="exam"><span class="i">📝</span>模擬考</button>
  <button data-v="pet"><span class="i" id="petTabIcon">🥚</span>寵物</button>
</nav>
<div class="toast" id="toast"></div>

<script>

const TONES=["","ˊ","ˇ","ˋ"];
function toneVariants(zy){const base=zy.replace(/[ˊˇˋ˙]/g,"");return TONES.map(t=>base+t);}
const radShow=r=>RAD_SHOW[r]||r;
function seeded(str){let h=0;for(const c of str)h=(h*31+c.codePointAt(0))>>>0;return ()=>{h=(h*1103515245+12345)>>>0;return h/4294967296;};}
function pickN(arr,n,rnd,exclude){const pool=arr.filter(x=>!exclude.includes(x));const out=[];while(out.length<n&&pool.length){out.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);}return out;}
function hlWord(word,ch){return word.replace(ch,'<span class="hl">'+ch+'</span>');}

const Q=[];
for(const L of LESSONS){
  for(const [ch,zy,rad,st,word] of CHARS[L.n]){
    const rnd=seeded(ch);
    Q.push({id:`L${L.n}-zy-${ch}`,l:L.n,ty:"zy",q:`「${hlWord(word,ch)}」的「${ch}」怎麼念？`,a:zy,o:toneVariants(zy).filter(x=>x!==zy),e:`${ch}：${zy}（${word}）`});
    // 部首、筆畫的干擾選項每次出題都重新抽
    Q.push({id:`L${L.n}-bs-${ch}`,l:L.n,ty:"bs",q:`<span class="big">${ch}</span><br>部首是什麼？`,a:radShow(rad),
      gen:()=>pickN(RAD_POOL,3,Math.random,[rad]).map(radShow),e:`「${ch}」是${radShow(rad)}部。`});
    Q.push({id:`L${L.n}-bh-${ch}`,l:L.n,ty:"bh",q:`<span class="big">${ch}</span><br>一共有幾畫？`,a:st+" 畫",
      gen:()=>pickN([-3,-2,-1,1,2,3].map(x=>st+x).filter(x=>x>0),3,Math.random,[]).map(x=>x+" 畫"),e:`「${ch}」共 ${st} 畫。`});
  }
}
HAND.forEach((h,i)=>{const [l,ty,q,opts,e]=h;Q.push({id:`L${l}-${ty}-h${i}`,l,ty,q,a:opts[0],o:opts.slice(1),e});});
const QMAP=Object.fromEntries(Q.map(q=>[q.id,q]));
function optsOf(q){return shuffle([q.a,...(q.gen?q.gen():q.o)]);}

/* stars：累積得到的星星（家長獎勵看這個）；spent：花在寵物和遊戲的星星 */
function freshState(){return {rec:{},stars:0,weak:[],spent:0,pet:null,rewards:[],redeemed:[],games:0};}
let S=freshState();
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);S=Object.assign(freshState(),p);}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}renderTop();}
load();
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
const balance=()=>Math.max(0,S.stars-S.spent);
function rec(id){return S.rec[id]||(S.rec[id]={r:0,w:0});}
let lastStar=false;
function markResult(id,ok){
  const r=rec(id);lastStar=false;
  if(ok){r.r++;
    // 同一題一天只給一次星星（避免一直刷同一題）
    if(r.d!==today()){r.d=today();S.stars++;lastStar=true;}
    S.weak=S.weak.filter(x=>x!==id);}
  else{r.w++;if(!S.weak.includes(id))S.weak.push(id);}
  save();checkRewards();
}
function addBonus(n,why){S.stars+=n;save();toast(`${why}，加 ${n} 顆星！`);checkRewards();}
function toggleWeak(id){if(S.weak.includes(id)){S.weak=S.weak.filter(x=>x!==id);toast("已移出不熟");}else{S.weak.push(id);toast("已加入不熟");}save();}

const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1400);}
function chips(el,items,selected,multi,onChange){
  el.innerHTML="";
  items.forEach(([v,label])=>{
    const b=document.createElement("button");b.className="chip"+(selected.has(v)?" on":"");b.textContent=label;
    b.onclick=()=>{if(multi){selected.has(v)?selected.delete(v):selected.add(v);if(!selected.size)selected.add(v);}else{selected.clear();selected.add(v);}
      [...el.children].forEach((c,i)=>c.classList.toggle("on",selected.has(items[i][0])));onChange&&onChange();};
    el.appendChild(b);
  });
}
const CHEER_OK=["答對了！好棒 🎉","太厲害了！⭐","完全正確！👍","你真用功！🌟","答對！繼續加油 💪"];
const CHEER_BAD=["沒關係，記起來就好 😊","差一點點！看看說明 👀","再想想看，下次一定會 💪"];
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ===================== 刷題器 ===================== */
let active=null; // 目前接收鍵盤的刷題器
function Runner(host,list,opts){
  this.host=host;this.list=list;this.i=0;this.ans={};this.opts=opts||{};this.cache={};
  active=this;this.render();
}
Runner.prototype.optsFor=function(q){
  if(!this.cache[q.id])this.cache[q.id]=optsOf(q);
  return this.cache[q.id];
};
Runner.prototype.render=function(){
  const h=this.host;
  if(!this.list.length){h.innerHTML=`<div class="card result"><div style="font-size:48px">🌈</div><h2>${this.opts.empty||"沒有題目"}</h2></div>`;return;}
  if(this.i>=this.list.length){
    const n=this.list.length,ok=this.list.filter(q=>this.ans[q.id]&&this.ans[q.id].ok).length;
    h.innerHTML=`<div class="card result"><div style="font-size:48px">🏆</div><h2>這一輪完成了！</h2><div class="score">${ok} / ${n}</div><div class="muted">答錯的題目已放進「不熟」</div><div class="nav2"><button class="btn" id="again">再練一次</button><button class="btn ghost" id="back">回設定</button></div></div>`;
    h.querySelector("#again").onclick=()=>{this.i=0;this.ans={};this.cache={};this.list=shuffle(this.list);this.render();};
    h.querySelector("#back").onclick=()=>this.opts.onBack&&this.opts.onBack();
    return;
  }
  const q=this.list[this.i],given=this.ans[q.id],L=LESSONS.find(x=>x.n===q.l);
  const os=this.optsFor(q),isWeak=S.weak.includes(q.id);
  h.innerHTML=`<div class="card">
    <div class="qmeta"><span><span class="tag">第${q.l}課 ${L.t}</span><span class="tag">${TYPES[q.ty]}</span><span class="tag">AI 模擬</span></span><span>${this.i+1} / ${this.list.length}</span></div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${os.map((o,k)=>{let c="opt";if(given){if(o===q.a)c+=" ok";else if(o===given.pick)c+=" bad";}
      return `<button class="${c}" data-k="${k}" ${given?"disabled":""}><span class="k">${k+1}</span><span>${o}</span></button>`;}).join("")}</div>
    ${given?`<div class="fb ${given.ok?"ok":"bad"} pop"><b>${given.ok?given.cheer:pick(CHEER_BAD)}</b>${given.ok?(given.star?" ⭐+1":"（這題今天已拿過星星）"):""}<br>${given.ok?"":"正確答案："+q.a+"<br>"}${q.e}</div>`:""}
    <div class="nav2">
      <button class="btn ghost" id="prev" ${this.i===0?"disabled":""}>← 上一題</button>
      <button class="btn ghost" id="flag">${isWeak?"移出不熟":"標不熟"}</button>
      <button class="btn" id="next">${given?"下一題 →":"跳過 →"}</button>
    </div>
    <div class="kbd">鍵盤：1–4 作答、Enter 下一題、← 上一題、F 標不熟</div>
  </div>`;
  h.querySelectorAll(".opt").forEach(b=>b.onclick=()=>this.answer(+b.dataset.k));
  h.querySelector("#prev").onclick=()=>this.prev();
  h.querySelector("#next").onclick=()=>this.next();
  h.querySelector("#flag").onclick=()=>{toggleWeak(q.id);this.render();};
};
Runner.prototype.answer=function(k){
  const q=this.list[this.i];if(!q||this.ans[q.id])return;
  const os=this.optsFor(q);if(k>=os.length)return;
  const ok=os[k]===q.a;markResult(q.id,ok);this.ans[q.id]={pick:os[k],ok,star:lastStar,cheer:pick(CHEER_OK)};this.render();
};
Runner.prototype.next=function(){if(this.i<this.list.length){this.i++;this.render();window.scrollTo(0,0);}};
Runner.prototype.prev=function(){if(this.i>0){this.i--;this.render();}};
Runner.prototype.flag=function(){const q=this.list[this.i];if(q){toggleWeak(q.id);this.render();}};

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA")return;
  if(examState&&examState.on){if(/^[1-4]$/.test(e.key))examAnswer(+e.key-1);return;}
  if(!active)return;
  if(/^[1-4]$/.test(e.key))active.answer(+e.key-1);
  else if(e.key==="Enter")active.next();
  else if(e.key==="ArrowLeft")active.prev();
  else if(e.key==="f"||e.key==="F")active.flag();
});

function renderHome(){
  $("#lessonList").innerHTML=LESSONS.map(L=>{const s=stat(Q.filter(q=>q.l===L.n));const p=Math.round(s.ok/s.n*100);
    return `<div class="lesson"><div style="flex:1"><b>第${L.n}課 ${L.t}</b><div class="bar"><i style="width:${p}%"></i></div><div class="muted">已會 ${s.ok} / ${s.n} 題</div></div><button class="btn" style="padding:8px 12px;font-size:16px" data-l="${L.n}">練習</button></div>`;}).join("");
  $("#lessonList").querySelectorAll("button").forEach(b=>b.onclick=()=>{pL.clear();pL.add(+b.dataset.l);pT.clear();Object.keys(TYPES).forEach(t=>pT.add(t));show("practice");startPractice();});
  $("#typeList").innerHTML=Object.entries(TYPES).map(([t,name])=>{const s=stat(Q.filter(q=>q.ty===t));const p=Math.round(s.ok/s.n*100);
    return `<div class="lesson"><div style="flex:1"><b>${name}</b><div class="bar"><i style="width:${p}%"></i></div><div class="muted">已會 ${s.ok} / ${s.n} 題</div></div></div>`;}).join("");
  // 家長區
  const rows=LESSONS.map(L=>{let r=0,w=0;Q.filter(q=>q.l===L.n).forEach(q=>{const x=S.rec[q.id];if(x){r+=x.r;w+=x.w;}});const weak=S.weak.filter(id=>QMAP[id]&&QMAP[id].l===L.n).length;return {L,r,w,weak,acc:r+w?Math.round(r/(r+w)*100):null};});
  const total=rows.reduce((a,b)=>a+b.r+b.w,0);
  $("#parentNote").textContent=total?`目前共作答 ${total} 次。下表是各課答對率與不熟題數：`:"孩子還沒開始作答，作答後這裡會顯示哪幾課比較弱。";
  $("#weakLessons").innerHTML=total?`<table><tr><th>課別</th><th>答對率</th><th>不熟</th></tr>${rows.map(x=>`<tr><td>第${x.L.n}課 ${x.L.t}</td><td>${x.acc===null?"—":x.acc+"%"}</td><td>${x.weak}</td></tr>`).join("")}</table>`:"";
}

/* ===================== 模擬考 ===================== */
const eL=new Set(LESSONS.map(l=>l.n)),eN=new Set([20]),eM=new Set(["free"]);
let examState=null;
/* 仿段考：各大題題數（共 50 題） */
const SECTIONS=[["zy",6],["gz",6],["xj",6],["bs",3],["bh",3],["tk",8],["sy",5],["jx",4],["cz",3],["zc",2],["kw",4]];
const CN_NUM="一二三四五六七八九十";
const secName=i=>i<10?CN_NUM[i]:"十"+CN_NUM[i-10];
function renderExamSetup(){
  chips($("#eLessons"),LESSONS.map(L=>[L.n,`第${L.n}課`]),eL,true);
  const upd=()=>{const m=[...eM][0];$("#eNumCard").classList.toggle("hide",m==="duan");
    $("#eModeNote").textContent=m==="duan"?"仿學校考卷：固定 50 題，分成注音、國字、形近字、部首、筆畫、選詞填空、相似／相反詞、標點量詞句型、改錯字、造詞、課文理解等大題，每次重新抽題。":"自己選題數，各種題型混在一起出。";};
  chips($("#eMode"),[["free","自選題數"],["duan","仿段考（50 題）"]],eM,false,upd);
  chips($("#eNum"),[[10,"10 題"],[20,"20 題"],[30,"30 題"],[40,"40 題"],[50,"50 題"]],eN,false);
  upd();
}
// 依「考過幾次」排序：沒考過的優先，同次數隨機
function freshFirst(list){S.ex=S.ex||{};return shuffle(list).sort((a,b)=>(S.ex[a.id]||0)-(S.ex[b.id]||0));}
$("#eStart").onclick=()=>{
  const pool=Q.filter(q=>eL.has(q.l));const mode=[...eM][0];let list=[];
  if(mode==="duan"){
    const used=new Set();
    SECTIONS.forEach(([ty,n],si)=>{freshFirst(pool.filter(q=>q.ty===ty)).slice(0,n).forEach(q=>{used.add(q.id);list.push(Object.assign({},q,{sec:si}));});});
    // 範圍太小、某題型不夠時，用其他題補到 50 題
    const target=50;const rest=freshFirst(pool.filter(q=>!used.has(q.id)));
    while(list.length<target&&rest.length){const q=rest.shift();const si=SECTIONS.findIndex(s=>s[0]===q.ty);list.push(Object.assign({},q,{sec:si}));}
    list.sort((a,b)=>a.sec-b.sec);
    // 每個大題內打亂
    const grouped=[];SECTIONS.forEach((s,si)=>grouped.push(...shuffle(list.filter(q=>q.sec===si))));list=grouped;
  }else{
    // 每種題型都抽到一些，且沒考過的優先
    const byType={};freshFirst(pool).forEach(q=>(byType[q.ty]=byType[q.ty]||[]).push(q));
    const n=Math.min([...eN][0],pool.length);const keys=Object.keys(byType);
    while(list.length<n){let added=false;for(const k of shuffle(keys)){if(list.length>=n)break;if(byType[k].length){list.push(byType[k].shift());added=true;}}if(!added)break;}
    list=shuffle(list);
  }
  S.ex=S.ex||{};list.forEach(q=>S.ex[q.id]=(S.ex[q.id]||0)+1);save();
  examState={on:true,list,i:0,pick:{},opts:{},duan:mode==="duan"};
  examState.list.forEach(q=>examState.opts[q.id]=optsOf(q));
  active=null;$("#eSetup").classList.add("hide");$("#eRun").classList.remove("hide");renderExam();
};
function examAnswer(k){const st=examState,q=st.list[st.i];const os=st.opts[q.id];if(k<os.length){st.pick[q.id]=os[k];renderExam();}}
function renderExam(){
  const st=examState,h=$("#eRun");
  if(!st.on){return;}
  const q=st.list[st.i],L=LESSONS.find(x=>x.n===q.l),os=st.opts[q.id];
  const doneN=Object.keys(st.pick).length;
  h.innerHTML=`<div class="card">
    <div class="qmeta"><span>${st.duan?`<span class="tag" style="background:var(--brand-soft);color:var(--brand)">${secName(q.sec)}、${TYPES[q.ty]}</span>`:`<span class="tag">${TYPES[q.ty]}</span>`}<span class="tag">第${q.l}課 ${L.t}</span></span><span>第 ${st.i+1} / ${st.list.length} 題・已作答 ${doneN}</span></div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${os.map((o,k)=>`<button class="opt${st.pick[q.id]===o?" pick":""}" data-k="${k}"><span class="k">${k+1}</span><span>${o}</span></button>`).join("")}</div>
    <div class="nav2"><button class="btn ghost" id="ep" ${st.i===0?"disabled":""}>← 上一題</button>
    ${st.i<st.list.length-1?`<button class="btn" id="en">下一題 →</button>`:`<button class="btn" id="es">交卷 ✅</button>`}</div>
    ${st.i<st.list.length-1?`<div style="margin-top:8px"><button class="btn ghost wide" id="es2">提前交卷</button></div>`:""}
  </div>`;
  h.querySelectorAll(".opt").forEach(b=>b.onclick=()=>examAnswer(+b.dataset.k));
  h.querySelector("#ep").onclick=()=>{st.i--;renderExam();};
  const en=h.querySelector("#en");if(en)en.onclick=()=>{st.i++;renderExam();window.scrollTo(0,0);};
  const sub=()=>{const left=st.list.length-Object.keys(st.pick).length;if(left&&!confirmSoft(left))return;submitExam();};
  const es=h.querySelector("#es");if(es)es.onclick=sub;
  const es2=h.querySelector("#es2");if(es2)es2.onclick=sub;
}
let pendingSubmit=false;
function confirmSoft(left){if(pendingSubmit){pendingSubmit=false;return true;}pendingSubmit=true;toast(`還有 ${left} 題沒寫，再按一次交卷`);setTimeout(()=>pendingSubmit=false,3000);return false;}
function submitExam(){
  const st=examState;st.on=false;
  let ok=0;
  st.list.forEach(q=>{const good=st.pick[q.id]===q.a;if(good)ok++;markResult(q.id,good);});
  const score=Math.round(ok/st.list.length*100);
  const wrong=st.list.filter(q=>st.pick[q.id]!==q.a);
  const bonus=st.list.length>=10?(score===100?10:score>=90?5:0):0;
  if(bonus){addBonus(bonus,score===100?"模擬考滿分":"模擬考 90 分以上");confetti();}
  $("#eRun").innerHTML=`<div class="card result pop"><div style="font-size:48px">${score>=90?"🏆":score>=70?"🎉":"💪"}</div><h2>模擬考成績</h2><div class="score">${score} 分</div><div class="muted">答對 ${ok} / ${st.list.length} 題${wrong.length?"，錯題已放進「不熟」":""}</div>${bonus?`<div class="bubble">🎁 獎勵星星 +${bonus}</div>`:`<div class="muted" style="margin-top:6px">考 10 題以上拿 90 分，可以多拿 5 顆星；滿分多拿 10 顆！</div>`}</div>
  ${wrong.map(q=>`<div class="card"><div class="qmeta"><span><span class="tag">第${q.l}課</span><span class="tag">${TYPES[q.ty]}</span></span></div><div style="font-size:19px;margin:6px 0">${q.q}</div><div class="fb bad">你的答案：${st.pick[q.id]||"（沒寫）"}<br>正確答案：<b>${q.a}</b><br>${q.e}</div></div>`).join("")}
  <div class="nav2"><button class="btn" id="eAgain">再考一次</button><button class="btn ghost" id="eWeak">去練不熟</button></div>`;
  $("#eAgain").onclick=()=>{$("#eRun").classList.add("hide");$("#eSetup").classList.remove("hide");renderExamSetup();};
  $("#eWeak").onclick=()=>show("weak");
  window.scrollTo(0,0);
}

function copyText(t,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback());}else fallback();
  function fallback(){const box=$("#importBox");box.value=t;box.select();try{document.execCommand("copy");done();}catch(e){toast("已放進下方框框，請手動複製");}}
}

function E(cx,cy,rx,ry,fill,extra=""){return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${OL}" stroke-width="${SW}" ${extra}/>`;}
function En(cx,cy,rx,ry,fill,extra=""){return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" ${extra}/>`;}
function P(d,fill,extra=""){return `<path d="${d}" fill="${fill}" stroke="${OL}" stroke-width="${SW}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;}
function L(d,w=2.6,c=OL){return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;}

function eyes(o={}){
  const y=o.y||90,dx=o.dx||20,c=o.c||"#2a1d16";
  if(o.happy) return L(`M${100-dx-7} ${y+2} Q${100-dx} ${y-7} ${100-dx+7} ${y+2}`,3.4)+L(`M${100+dx-7} ${y+2} Q${100+dx} ${y-7} ${100+dx+7} ${y+2}`,3.4);
  return [100-dx,100+dx].map(x=>En(x,y,6.5,8.5,c)+En(x+2.2,y-3,2.6,2.8,"#fff")+En(x-2,y+3.5,1.2,1.2,"#fff")).join("");
}
function cheeks(c="#ff9aa8",y=104,dx=33){return En(100-dx,y,8.5,5.2,c,'opacity=".55"')+En(100+dx,y,8.5,5.2,c,'opacity=".55"');}
function smile(y=106,w=6){return L(`M${100-w} ${y} Q${100-w/2} ${y+5} 100 ${y} Q${100+w/2} ${y+5} ${100+w} ${y}`,2.6);}
function body(c,belly,o={}){

function daysSince(d){if(!d)return 99;const [y,m,dd]=d.split("-").map(Number);return Math.floor((new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())-new Date(y,m-1,dd))/864e5);}

  </div>
  <div class="card"><div class="wallet"><div><b>${bal}</b>可以用的星星</div><div><b>${S.stars}</b>累積拿到的星星</div></div>
    <div class="muted" style="text-align:center;margin-top:6px">答對題目拿星星（同一題一天拿一次）</div></div>
  <div class="card"><h2>🍽️ 餵 ${S.pet.name}</h2>

    <div class="muted">花 ⭐${GAME_COST} 玩一局，把生字和注音（或部首）配成一對。過關可以讓 ${S.pet.name} 成長 +15！</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="gZy" ${bal<GAME_COST?"disabled":""}>注音配對</button><button class="btn" id="gBs" ${bal<GAME_COST?"disabled":""}>部首配對</button></div>
    <div id="gameHost"></div>
  </div>
  <div class="card"><div class="row"><button class="btn ghost" id="rename">改名字</button><button class="btn ghost" id="repick">換寵物／換造型</button></div>
    <div class="muted" style="margin-top:6px">換寵物或換造型都會保留等級。</div></div>`;
  h.querySelector("#petE").onclick=()=>{bounce();hearts(3);h.querySelector("#say").textContent=pick(TALK);};
  h.querySelectorAll(".food").forEach(b=>b.onclick=()=>feed(FOODS[+b.dataset.i]));
  h.querySelector("#gZy").onclick=()=>startGame("zy");
  h.querySelector("#gBs").onclick=()=>startGame("bs");

    box.querySelector("#nok").onclick=()=>{const v=box.querySelector("#nn").value.trim();if(v){S.pet.name=v;save();}renderPet();};};

function bounce(){const e=$("#petE");if(!e)return;e.classList.remove("bounce");void e.offsetWidth;e.classList.add("bounce");}
function hearts(n,ch){const st=$("#stage");if(!st)return;for(let i=0;i<n;i++){const s=document.createElement("span");s.className="heart";s.textContent=ch||pick(["💛","💕","✨","💖"]);s.style.setProperty("--dx",(Math.random()*120-60)+"px");s.style.animationDelay=(i*0.12)+"s";st.appendChild(s);setTimeout(()=>s.remove(),1600);}}
function confetti(){for(let i=0;i<24;i++){const s=document.createElement("span");s.className="confetti";s.textContent=pick(["🎉","⭐","🎊","✨","💛"]);s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*0.6+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
function growPet(x){
  const before=petLevel().lv;S.pet.xp+=x;S.pet.fed=today();save();
  const after=petLevel().lv;
  if(after>before){renderPet();confetti();hearts(6,"⭐");toast(after===2?`蛋孵化了！${S.pet.name}出生了 🎉`:`${S.pet.name}升到 Lv.${after}「${LV_TITLE[after-1]}」！`);}
  return after>before;
}
function feed(f){
  if(balance()<f.c){toast("星星不夠喔");return;}
  S.spent+=f.c;
  const up=growPet(f.x);
  if(!up){renderPet();bounce();hearts(4,f.e);const s=$("#say");if(s)s.textContent=pick([`好好吃！謝謝你 ${f.e}`,"吃飽飽，好開心！","嗯～還想再吃！","我覺得自己變大了一點！"]);}
}

/* ===================== 翻牌配對 ===================== */
let G=null;
function startGame(mode){
  if(balance()<GAME_COST){toast("星星不夠喔");return;}
  // 抽 6 個字，注音／部首不能重複，避免配對有兩種答案
  const all=shuffle(Object.values(CHARS).flat());const used=new Set(),pairs=[];
  for(const c of all){const key=mode==="zy"?c[1]:c[2];if(used.has(key))continue;used.add(key);pairs.push(c);if(pairs.length===6)break;}
  S.spent+=GAME_COST;S.games=(S.games||0)+1;save();
  const cards=[];pairs.forEach((c,i)=>{cards.push({p:i,t:c[0],z:false});cards.push({p:i,t:mode==="zy"?c[1]:radShow(c[2])+"部",z:true});});
  G={mode,cards:shuffle(cards),open:[],done:new Set(),moves:0,lock:false,pairs};
  renderPetTopOnly();renderGame();
  const gh=$("#gameHost");if(gh)gh.scrollIntoView({behavior:"smooth",block:"start"});
}
function renderPetTopOnly(){const w=document.querySelector("#v-pet .wallet b");if(w)w.textContent=balance();document.querySelectorAll("#gZy,#gBs").forEach(b=>b.disabled=true);}
function renderGame(){
  const h=$("#gameHost");if(!h||!G)return;
  h.innerHTML=`<div class="muted" style="margin:10px 0 6px">${G.mode==="zy"?"把「字」和它的「注音」配成一對":"把「字」和它的「部首」配成一對"}・翻了 ${G.moves} 次</div>
  <div class="board">${G.cards.map((c,i)=>{const up=G.open.includes(i)||G.done.has(c.p);const cls="cardf"+(up?" up":"")+(G.done.has(c.p)?" done":"")+(c.z?" zy":"")+(c.miss?" miss":"");return `<button class="${cls}" data-i="${i}">${up?c.t:"？"}</button>`;}).join("")}</div>`;
  h.querySelectorAll(".cardf").forEach(b=>b.onclick=()=>flip(+b.dataset.i));
}
function flip(i){
  if(!G||G.lock)return;const c=G.cards[i];
  if(G.done.has(c.p)||G.open.includes(i))return;
  G.open.push(i);
  if(G.open.length===2){
    G.moves++;const [a,b]=G.open.map(k=>G.cards[k]);
    if(a.p===b.p){G.done.add(a.p);G.open=[];
      if(G.done.size===G.pairs.length){renderGame();winGame();return;}
    }else{G.lock=true;a.miss=b.miss=true;renderGame();setTimeout(()=>{a.miss=b.miss=false;G.open=[];G.lock=false;renderGame();},900);return;}
  }
  renderGame();
}
function winGame(){
  const moves=G.moves,mode=G.mode,pairs=G.pairs;G=null;
  const great=moves<=10;
  const up=growPet(great?25:15);
  confetti();
  if(!up)renderPet();
  const h=$("#gameHost");
  if(h)h.innerHTML=`<div class="fb ok pop" style="text-align:center"><div style="font-size:40px">🏆</div><b>過關了！只翻了 ${moves} 次</b><br>${great?"翻得超準！成長 +25":"成長 +15"}<br><span class="muted">${pairs.map(c=>`${c[0]} ${mode==="zy"?c[1]:radShow(c[2])+"部"}`).join("、")}</span></div>`;
  if(h)h.scrollIntoView({behavior:"smooth",block:"center"});
}

/* ===================== 家長獎勵 ===================== */
function renderRewardsInto(h,beforePet){
  const div=document.createElement("div");div.className="card";
  const list=S.rewards||[];
  div.innerHTML=`<h2>🎁 爸媽的獎勵</h2>${list.length?list.map(r=>{const got=S.redeemed.includes(r.id),ready=S.stars>=r.need&&!got,p=Math.min(100,Math.round(S.stars/r.need*100));
    return `<div class="reward ${ready?"ready":""}"><b>${got?"✅ ":ready?"🎉 ":""}${esc(r.name)}</b>　<span class="muted">累積 ⭐${r.need}</span>
      ${got?`<div class="muted">已經兌換過了</div>`:ready?`<div>達成了！拿給爸媽看，請他們按確認 👇</div><button class="btn" style="margin-top:6px;font-size:16px;padding:8px 14px" data-r="${r.id}">家長確認兌換</button><div class="gateBox"></div>`:`<div class="bar"><i style="width:${p}%"></i></div><div class="muted">還差 ${r.need-S.stars} 顆星</div>`}</div>`;}).join(""):`<div class="muted">爸媽還沒設定獎勵。請爸媽到「首頁 → 給家長 → 設定實體獎勵」新增。</div>`}
    <div class="muted" style="margin-top:6px">獎勵看「累積拿到的星星」，餵寵物花掉的星星不會扣。</div>`;
  h.appendChild(div);
  div.querySelectorAll("button[data-r]").forEach(b=>b.onclick=()=>{
    const box=b.nextElementSibling;parentGate(box,()=>{S.redeemed.push(b.dataset.r);save();confetti();toast("兌換成功！");renderPet();});});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function parentGate(box,ok){
  const a=12+Math.floor(Math.random()*8),b=13+Math.floor(Math.random()*7);
  box.innerHTML=`<div class="gate"><div>家長驗證：${a} × ${b} = ？</div><div class="row" style="margin-top:6px"><input class="txt" style="flex:1;min-width:0" inputmode="numeric" id="gateIn"><button class="btn" id="gateOk">確定</button></div></div>`;
  box.querySelector("#gateOk").onclick=()=>{if(+box.querySelector("#gateIn").value===a*b){box.innerHTML="";ok();}else toast("答案不對喔");};
}
let rewardOpen=false;
function renderRewardEditor(){
  const ed=$("#rewardEditor");
  ed.innerHTML=`<div class="gate"><b>實體獎勵設定</b><div class="muted">孩子「累積拿到的星星」達到門檻就能兌換。參考：每天認真練大約可拿 20～40 顆星。</div>
    ${(S.rewards||[]).map(r=>`<div class="row" style="justify-content:space-between;margin-top:8px"><span>${esc(r.name)}（⭐${r.need}）${S.redeemed.includes(r.id)?"✅":""}</span><button class="chip" data-del="${r.id}">刪除</button></div>`).join("")}
    <div style="margin-top:10px"><input class="txt" id="rwName" placeholder="獎勵內容，例如：看卡通 20 分鐘"></div>
    <div class="row" style="margin-top:8px"><input class="txt" id="rwNeed" inputmode="numeric" placeholder="需要幾顆星，例如 50" style="flex:1;min-width:0"><button class="btn" id="rwAdd">新增</button></div>
    <div style="margin-top:8px"><button class="btn ghost" id="rwClose">完成</button></div></div>`;
  ed.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.rewards=S.rewards.filter(r=>r.id!==b.dataset.del);save();renderRewardEditor();});
  ed.querySelector("#rwAdd").onclick=()=>{const n=ed.querySelector("#rwName").value.trim(),k=parseInt(ed.querySelector("#rwNeed").value,10);
    if(!n||!(k>0)){toast("請填獎勵內容和星星數");return;}S.rewards.push({id:"r"+Date.now(),name:n,need:k});save();renderRewardEditor();toast("已新增獎勵");};
  ed.querySelector("#rwClose").onclick=()=>{ed.innerHTML="";rewardOpen=false;};
}
$("#rewardSetBtn").onclick=()=>parentGate($("#rewardEditor"),renderRewardEditor);
let notified=new Set();
function checkRewards(){(S.rewards||[]).forEach(r=>{if(S.stars>=r.need&&!S.redeemed.includes(r.id)&&!notified.has(r.id)){notified.add(r.id);setTimeout(()=>{toast(`🎁 達成獎勵「${r.name}」！到寵物頁找爸媽兌換`);confetti();},600);}});}
(S.rewards||[]).forEach(r=>{if(S.stars>=r.need)notified.add(r.id);});

/* ===================== 深淺色 ===================== */
(function(){
  let t=null;try{t=localStorage.getItem(KEY+"-theme");}catch(e){}
  if(t)document.documentElement.dataset.theme=t;
  $("#themeBtn").onclick=()=>{
    const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;try{localStorage.setItem(KEY+"-theme",nx);}catch(e){}
  };
})();

renderTop();renderHome();
</script>
</body>
</html>
