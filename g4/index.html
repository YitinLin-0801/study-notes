<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23302c;--muted:#66746f;--line:#e2ddd0;--pri:#2f7d6d;--pri2:#e3f1ec;--ok:#2e9a55;--okbg:#e5f6ea;--bad:#d1493f;--badbg:#fde9e6;--star:#f2a516;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
header h1{font-size:22px;margin:0}
.stars{font-weight:700;color:var(--star);font-size:20px;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{background:none;border:0;padding:6px 4px;border-radius:12px;font-size:14px;flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
nav button b{font-size:22px;line-height:1}
nav button.on{color:var(--pri);background:var(--pri2);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.note{font-size:14px;color:var(--muted)}
.subj{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sbtn{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 12px;text-align:left}
.sbtn .nm{font-size:22px;font-weight:800}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.unit{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:0}
.unit .t{flex:1;min-width:0}
.unit .t div{font-weight:700}
.btn{border:0;background:var(--pri);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;font-size:18px}
.btn.sm{padding:8px 14px;font-size:16px}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.warn{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:16px}
.chip.on{border-color:var(--pri);background:var(--pri2);color:var(--pri);font-weight:700}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-size:14px;font-weight:700}
.qtext{font-size:23px;font-weight:700;margin:14px 0 16px;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font-size:20px;min-height:60px}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:16px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.pick{border-color:var(--pri);background:var(--pri2)}
.opt:disabled{cursor:default;opacity:1}
.fb{border-radius:16px;padding:12px 14px;margin-top:14px;font-size:18px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb b{font-size:20px}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.big{font-size:44px;font-weight:800;text-align:center;margin:6px 0}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-size:64px;pointer-events:none;opacity:0;z-index:20}
.pop.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
.weak{color:var(--bad);font-weight:700}
textarea{width:100%;min-height:90px;font:inherit;font-size:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px}
.hide{display:none!important}
.rv{padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.rv:last-child{border-bottom:0}
h2{font-size:20px;margin:4px 0 8px}
</style>

const SUBJ=["國語","數學","自然","社會","英語"];
const RANGE={"國語":"康軒 第1–6課","數學":"翰林 第1–4單元","自然":"翰林 第1–2單元","社會":"翰林 第1–2單元","英語":"翰林 Here We Go 3 Starter、U1–U2"};
const CHEER=["太棒了！","答對了！","好厲害！","繼續保持！","你真行！","完全正確！"];
const ENC=["沒關係，再想想看！","差一點點！","記下來，下次就會了！","加油，錯了才會進步！"];
// 建立題庫
const Q=[];
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))|0;return (h>>>0).toString(36)}
BANK.forEach((u,ui)=>u.q.forEach(r=>{const tf=r[2]==="TF";Q.push({id:hash(u.s+r[0]),s:u.s,u:u.u,ui,q:r[0],tf,ans:tf?(r[1]?"⭕ 對":"❌ 錯"):r[1],opts:tf?["⭕ 對","❌ 錯"]:[r[1],...r[2]],e:r[3]})}));
const UNITS=BANK.map((u,i)=>({s:u.s,u:u.u,i}));
// 紀錄
const KEY="g4-review-115-1";
let S={st:{},weak:[],stars:0};
function load(){try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
function rec(id,ok){const r=S.st[id]||(S.st[id]={c:0,w:0});ok?r.c++:r.w++;r.l=ok?1:0;
 if(ok){S.stars++;const i=S.weak.indexOf(id);if(i>=0)S.weak.splice(i,1)}else if(!S.weak.includes(id))S.weak.push(id);save();drawStars()}
function drawStars(){document.getElementById("stars").textContent="⭐ "+S.stars}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=s=>`var(--c${s})`;
const done=list=>list.filter(q=>S.st[q.id]&&S.st[q.id].l===1).length;
const app=document.getElementById("app");
let view="home",sess=null,keyH=null;
function setNav(v){view=v;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;go(b.dataset.v)};
function go(v,arg){setNav(v);keyH=null;window.scrollTo(0,0);({home,subject,weak,exam,parent})[v](arg)}

// 首頁
function home(){
 const tot=Q.length,d=done(Q);
 app.innerHTML=`<div class="card"><div style="font-size:20px;font-weight:700">今天也來刷幾題吧！💪</div>
 <div class="note">已經會了 ${d} / ${tot} 題・不熟 ${S.weak.length} 題</div><div class="bar"><i style="width:${d/tot*100}%"></i></div></div>
 <h2>選一科開始</h2><div class="subj">${SUBJ.map(s=>{const l=Q.filter(q=>q.s===s),dd=done(l);
 return `<button class="sbtn" data-s="${s}" style="border-color:${col(s)}"><div class="nm" style="color:${col(s)}">${s}</div><div class="note">${RANGE[s]}</div><div class="note">${dd}/${l.length} 題</div><div class="bar"><i style="width:${dd/l.length*100}%;background:${col(s)}"></i></div></button>`}).join("")}</div>
 <div class="card"><h2>🎲 綜合挑戰</h2><div class="note">五科隨機出 20 題，答錯會自動加入「不熟」。</div><div class="row" style="margin-top:10px"><button class="btn" id="mix">開始挑戰</button></div></div>
 <p class="note">※ 題目為 AI 依各版本課程內容整理的模擬題，用字可能和課本略有不同；請以課本和老師上課內容為準。</p>`;
 app.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{window.scrollTo(0,0);subject(b.dataset.s)});
 app.querySelector("#mix").onclick=()=>startPractice(shuffle(Q).slice(0,20),"綜合挑戰",()=>go("home"));
}
// 科目頁
let order="new";
function subject(s){
 const us=UNITS.filter(u=>u.s===s);
 app.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn sm ghost" id="back">← 回首頁</button><span class="tag" style="background:${col(s)}">${s}</span></div>
 <div class="card"><div class="note">出題順序</div><div class="chips" id="ord">${[["new","先做沒做過的"],["rand","隨機"],["seq","照順序"]].map(([k,t])=>`<button class="chip ${order===k?"on":""}" data-k="${k}">${t}</button>`).join("")}</div>
 <div class="row" style="margin-top:12px"><button class="btn" id="all" style="background:${col(s)}">整科一起練（${Q.filter(q=>q.s===s).length} 題）</button></div></div>
 <div class="card">${us.map(u=>{const l=Q.filter(q=>q.ui===u.i),dd=done(l),wk=l.filter(q=>S.weak.includes(q.id)).length;
 return `<div class="unit"><div class="t"><div>${esc(u.u)}</div><div class="note">會了 ${dd}/${l.length}${wk?` ・<span class="weak">不熟 ${wk}</span>`:""}</div><div class="bar"><i style="width:${dd/l.length*100}%;background:${col(s)}"></i></div></div><button class="btn sm" data-u="${u.i}" style="background:${col(s)}">練習</button></div>`}).join("")}</div>`;
 app.querySelector("#back").onclick=()=>go("home");
 app.querySelector("#ord").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;order=b.dataset.k;subject(s)};
 const pick=l=>order==="seq"?l:order==="rand"?shuffle(l):[...shuffle(l.filter(q=>!S.st[q.id])),...shuffle(l.filter(q=>S.st[q.id]&&S.st[q.id].l!==1)),...shuffle(l.filter(q=>S.st[q.id]&&S.st[q.id].l===1))];
 app.querySelector("#all").onclick=()=>startPractice(pick(Q.filter(q=>q.s===s)),s,()=>subject(s));
 app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const u=+b.dataset.u;startPractice(pick(Q.filter(q=>q.ui===u)),UNITS[u].u,()=>subject(s))});
}
// 練習
function startPractice(list,title,back,isWeak){sess={list,title,back,i:0,ans:{},opt:{},right:0,isWeak};list.forEach(q=>sess.opt[q.id]=q.tf?q.opts:shuffle(q.opts));drawQ()}
function drawQ(){
 const s=sess;if(s.i>=s.list.length)return endPractice();
 const q=s.list[s.i],a=s.ans[q.id],opts=s.opt[q.id],isW=S.weak.includes(q.id);
 app.innerHTML=`<div class="qtop"><button class="btn sm ghost" id="quit">✕ 離開</button><span>${esc(s.title)}・第 ${s.i+1} / ${s.list.length} 題</span></div>
 <div class="bar"><i style="width:${s.i/s.list.length*100}%"></i></div>
 <div class="card"><div class="row"><span class="tag" style="background:${col(q.s)}">${q.s}</span><span class="note">${esc(q.u)}</span>${isW?'<span class="note weak">🔁 不熟</span>':""}</div>
 <div class="qtext">${esc(q.q)}</div>
 <div class="opts">${opts.map((o,k)=>{let c="";if(a!==undefined){if(o===q.ans)c="ok";else if(k===a)c="bad"}return `<button class="opt ${c}" data-k="${k}" ${a!==undefined?"disabled":""}><span class="k">${k+1}</span><span>${esc(o)}</span></button>`}).join("")}</div>
 ${a!==undefined?(opts[a]===q.ans?`<div class="fb ok"><b>🎉 ${CHEER[Math.random()*CHEER.length|0]}</b><div>${esc(q.e)}</div></div>`:`<div class="fb bad"><b>💡 ${ENC[Math.random()*ENC.length|0]}</b><div>正確答案：<b>${esc(q.ans)}</b></div><div>${esc(q.e)}</div><div class="note">已加入「不熟」，之後可以再練。</div></div>`):""}
 <div class="qnav"><button class="btn sm ghost" id="prev" ${s.i===0?"disabled style='opacity:.4'":""}>← 上一題</button>
 <button class="btn sm ${isW?"warn":"ghost"}" id="flag">${isW?"取消不熟":"🔁 標不熟"}</button>
 <button class="btn sm" id="next" ${a===undefined?"style='opacity:.5'":""}>${s.i===s.list.length-1?"看結果":"下一題 →"}</button></div></div>
 <p class="note">鍵盤：1–4 作答・Enter 下一題・← 上一題・F 標不熟</p>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
 app.querySelector("#quit").onclick=()=>s.back();
 app.querySelector("#prev").onclick=()=>{if(s.i>0){s.i--;drawQ()}};
 app.querySelector("#next").onclick=next;
 app.querySelector("#flag").onclick=()=>{const i=S.weak.indexOf(q.id);i>=0?S.weak.splice(i,1):S.weak.push(q.id);save();drawQ()};
 keyH=e=>{if(e.key>="1"&&e.key<=String(opts.length))answer(+e.key-1);else if(e.key==="Enter")next();else if(e.key==="ArrowLeft"&&s.i>0){s.i--;drawQ()}else if(e.key==="f"||e.key==="F")app.querySelector("#flag").click()};
}
function answer(k){const s=sess,q=s.list[s.i];if(s.ans[q.id]!==undefined)return;s.ans[q.id]=k;const ok=s.opt[q.id][k]===q.ans;if(ok){s.right++;const p=document.getElementById("pop");p.classList.remove("go");void p.offsetWidth;p.classList.add("go")}rec(q.id,ok);drawQ()}
function next(){const s=sess,q=s.list[s.i];if(s.ans[q.id]===undefined)return;s.i++;drawQ()}
function endPractice(){
 const s=sess,n=s.list.length,r=s.right,p=Math.round(r/n*100);
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:56px">${p>=90?"🏆":p>=70?"🎉":"💪"}</div><div class="big">${r} / ${n}</div>
 <div style="font-size:20px">${p>=90?"太厲害了，全部都快會了！":p>=70?"做得很好，再把錯的練一練！":"多練幾次一定會進步！"}</div>
 <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="b1">回上一頁</button>${S.weak.length?'<button class="btn ghost" id="b2">練不熟的題目</button>':""}</div></div>`;
 app.querySelector("#b1").onclick=()=>s.back();const b2=app.querySelector("#b2");if(b2)b2.onclick=()=>go("weak");
}
// 不熟
let wkS="全部";
function weak(){
 const all=Q.filter(q=>S.weak.includes(q.id)),l=wkS==="全部"?all:all.filter(q=>q.s===wkS);
 app.innerHTML=`<h2>🔁 不熟的題目（${all.length} 題）</h2><div class="note">答錯的題目會自動放到這裡；重練答對就會移出。</div>
 <div class="chips" id="wf" style="margin:10px 0">${["全部",...SUBJ].map(s=>`<button class="chip ${wkS===s?"on":""}" data-s="${s}">${s}${s==="全部"?"":"（"+all.filter(q=>q.s===s).length+"）"}</button>`).join("")}</div>
 ${l.length?`<div class="row"><button class="btn" id="go">重練這 ${l.length} 題</button></div><div class="card">${l.map(q=>`<div class="rv"><span class="tag" style="background:${col(q.s)}">${q.s}</span> ${esc(q.q)}<div class="note">答案：${esc(q.ans)}</div></div>`).join("")}</div>`:`<div class="card" style="text-align:center"><div style="font-size:48px">🌈</div>目前沒有不熟的題目，太棒了！</div>`}`;
 app.querySelector("#wf").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;wkS=b.dataset.s;weak()};
 const g=app.querySelector("#go");if(g)g.onclick=()=>startPractice(shuffle(l),"不熟重練",()=>go("weak"),true);
}
// 模擬考
let exS="國語",exN=20;
function exam(){
 app.innerHTML=`<h2>📝 模擬考</h2><div class="note">像真的考試一樣：全部寫完再交卷，交卷後才看分數和答案。</div>
 <div class="card"><div class="note">科目</div><div class="chips" id="es">${[...SUBJ,"五科綜合"].map(s=>`<button class="chip ${exS===s?"on":""}" data-s="${s}">${s}</button>`).join("")}</div>
 <div class="note" style="margin-top:12px">題數</div><div class="chips" id="en">${[10,20,30].map(n=>`<button class="chip ${exN===n?"on":""}" data-n="${n}">${n} 題</button>`).join("")}</div>
 <div class="row" style="margin-top:16px"><button class="btn" id="st">開始考試</button></div></div>`;
 app.querySelector("#es").onclick=e=>{const b=e.target.closest(".chip");if(b){exS=b.dataset.s;exam()}};
 app.querySelector("#en").onclick=e=>{const b=e.target.closest(".chip");if(b){exN=+b.dataset.n;exam()}};
 app.querySelector("#st").onclick=()=>{const pool=exS==="五科綜合"?Q:Q.filter(q=>q.s===exS);const list=shuffle(pool).slice(0,exN);sess={list,ans:{},opt:{}};list.forEach(q=>sess.opt[q.id]=q.tf?q.opts:shuffle(q.opts));drawExam()};
}
function drawExam(){
 const s=sess,left=s.list.filter(q=>s.ans[q.id]===undefined).length;
 app.innerHTML=`<div class="qtop"><button class="btn sm ghost" id="quit">✕ 放棄</button><span>${exS}・還有 ${left} 題沒寫</span></div>
 ${s.list.map((q,n)=>`<div class="card"><div class="row"><b>${n+1}.</b><span class="tag" style="background:${col(q.s)}">${q.s}</span></div><div class="qtext" style="font-size:20px;margin:8px 0 10px">${esc(q.q)}</div>
 <div class="opts">${s.opt[q.id].map((o,k)=>`<button class="opt ${s.ans[q.id]===k?"pick":""}" data-q="${n}" data-k="${k}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join("")}</div></div>`).join("")}
 <div class="row" style="justify-content:center"><button class="btn" id="sub">交卷 ✋</button></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const q=s.list[+b.dataset.q];s.ans[q.id]=+b.dataset.k;b.parentNode.querySelectorAll(".opt").forEach(x=>x.classList.toggle("pick",x===b));app.querySelector(".qtop span").textContent=`${exS}・還有 ${s.list.filter(q=>s.ans[q.id]===undefined).length} 題沒寫`});
 app.querySelector("#quit").onclick=()=>go("exam");
 app.querySelector("#sub").onclick=()=>{const l=s.list.filter(q=>s.ans[q.id]===undefined).length;if(l&&!s.warned){s.warned=1;app.querySelector("#sub").textContent=`還有 ${l} 題沒寫，確定交卷？`;return}gradeExam()};
}
function gradeExam(){
 const s=sess;let r=0;const wrong=[];
 s.list.forEach(q=>{const a=s.ans[q.id],ok=a!==undefined&&s.opt[q.id][a]===q.ans;if(ok)r++;else wrong.push(q);rec(q.id,ok)});
 const sc=Math.round(r/s.list.length*100);
 app.innerHTML=`<div class="card" style="text-align:center"><div class="note">${exS} 模擬考</div><div class="big">${sc} 分</div><div>答對 ${r} / ${s.list.length} 題</div>
 <div style="font-size:20px;margin-top:6px">${sc>=90?"🏆 超級棒！":sc>=70?"🎉 很不錯！":"💪 把錯的題目弄懂，下次會更好！"}</div></div>
 ${wrong.length?`<h2>錯的題目（已加入不熟）</h2><div class="card">${wrong.map(q=>`<div class="rv">${esc(q.q)}<div class="note">你的答案：${s.ans[q.id]===undefined?"沒寫":esc(s.opt[q.id][s.ans[q.id]])}</div><div><b style="color:var(--ok)">正確：${esc(q.ans)}</b></div><div class="note">${esc(q.e)}</div></div>`).join("")}</div>`:""}
 <div class="row" style="justify-content:center"><button class="btn" id="again">再考一次</button></div>`;
 app.querySelector("#again").onclick=()=>go("exam");window.scrollTo(0,0);
}
// 家長區
function parent(){
 const rows=UNITS.map(u=>{const l=Q.filter(q=>q.ui===u.i);let c=0,w=0;l.forEach(q=>{const r=S.st[q.id];if(r){c+=r.c;w+=r.w}});const t=c+w,acc=t?Math.round(c/t*100):null,wk=l.filter(q=>S.weak.includes(q.id)).length;return {u,t,acc,wk,n:l.length,d:done(l)}});
 const weakest=rows.filter(r=>r.t>=3&&r.acc<70).sort((a,b)=>a.acc-b.acc);
 app.innerHTML=`<h2>👪 家長區</h2>
 <div class="card"><b>需要加強的單元</b><div class="note">作答 3 次以上、正確率低於 70% 的單元</div>
 ${weakest.length?weakest.map(r=>`<div class="weak">・${r.u.s}｜${esc(r.u.u)}（${r.acc}%）</div>`).join(""):'<div class="note" style="margin-top:6px">目前沒有明顯弱點，或作答次數還不夠。</div>'}</div>
 <div class="card" style="overflow-x:auto"><table><tr><th>單元</th><th class="n">會了</th><th class="n">正確率</th><th class="n">不熟</th></tr>
 ${rows.map(r=>`<tr><td><span style="color:${col(r.u.s)};font-weight:700">${r.u.s}</span> ${esc(r.u.u)}</td><td class="n">${r.d}/${r.n}</td><td class="n ${r.acc!==null&&r.acc<70?"weak":""}">${r.acc===null?"—":r.acc+"%"}</td><td class="n">${r.wk||""}</td></tr>`).join("")}</table></div>
 <div class="card"><b>📋 匯出錯題清單</b><div class="note">可貼到 LINE 或記事本，印出來複習。</div><div class="row" style="margin-top:8px"><button class="btn sm" id="cp">複製不熟題目</button></div></div>
 <div class="card"><b>💾 備份／換裝置</b><div class="note">紀錄只存在這台裝置的瀏覽器。要換手機或平板時，先在這裡「產生備份碼」，到新裝置貼上後按「匯入」。</div>
 <div class="row" style="margin:8px 0"><button class="btn sm" id="ex">產生備份碼</button><button class="btn sm ghost" id="im">匯入</button><button class="btn sm warn" id="rs">清除全部紀錄</button></div>
 <textarea id="bk" placeholder="備份碼會出現在這裡，或把備份碼貼在這裡再按匯入"></textarea><div class="note" id="msg"></div></div>
 <p class="note">範圍：${SUBJ.map(s=>s+" "+RANGE[s]).join("；")}。共 ${Q.length} 題，皆為 AI 模擬題。</p>`;
 const msg=t=>app.querySelector("#msg").textContent=t;
 const copy=t=>{const ta=app.querySelector("#bk");ta.value=t;ta.select();try{navigator.clipboard.writeText(t).then(()=>msg("已複製 ✅"),()=>msg("請手動全選複製"))}catch(e){msg("請手動全選複製")}};
 app.querySelector("#cp").onclick=()=>{const l=Q.filter(q=>S.weak.includes(q.id));copy(l.length?"【四上不熟題目】\n"+l.map((q,i)=>`${i+1}. [${q.s}] ${q.q}\n   答案：${q.ans}`).join("\n"):"目前沒有不熟的題目");};
 app.querySelector("#ex").onclick=()=>copy("G4BK:"+btoa(unescape(encodeURIComponent(JSON.stringify(S)))));
 app.querySelector("#im").onclick=()=>{try{const t=app.querySelector("#bk").value.trim().replace(/^G4BK:/,"");const o=JSON.parse(decodeURIComponent(escape(atob(t))));if(!o.st)throw 0;S=Object.assign({st:{},weak:[],stars:0},o);save();drawStars();parent();msg("匯入成功 ✅")}catch(e){msg("備份碼不正確，請確認有完整貼上")}};
