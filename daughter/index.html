<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雲朵樂園">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>雲朵學習樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: candy-shop sticker world — thick plum outlines, offset "sticker" shadows, big tap targets for an iPad in landscape. Single bright theme by choice. */
:root{
  --bg:#FDF1F5;          /* strawberry milk */
  --ink:#5B3B4C;         /* plum outline + text */
  --card:#FFFFFF;
  --berry:#F06C9B;
  --mint:#BFEBDC;
  --butter:#FFE58F;
  --sky:#BFE3FA;
  --lilac:#E6DAFB;
  --peach:#FFD9C2;
  --good:#3DBE8B;
  --pink:#FFD0E1;
  --dot:#F9DCE7;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;overscroll-behavior:none;
  background-image:radial-gradient(circle at 12px 12px,var(--dot) 2.5px,transparent 3px);
  background-size:36px 36px;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
#app{min-height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:12px 20px}

/* sticker surface */
.stk{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);transition:transform .12s,box-shadow .12s}
button.stk:active,.press:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}

/* top bar */
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:clamp(22px,3.2vw,32px);margin:0;letter-spacing:.04em;text-wrap:balance}
.top .sp{flex:1}
.ibtn{width:56px;height:56px;border-radius:50%;background:var(--card);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:26px;display:grid;place-items:center;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn.small{width:44px;height:44px;font-size:20px}
.pill{display:flex;align-items:center;gap:6px;background:var(--butter);border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 10px;font-size:24px;box-shadow:0 4px 0 var(--ink)}
.pill b{font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center}
.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.3)}}

/* home */
.home{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:20px;flex:1}
.petcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;background:linear-gradient(var(--sky) 0 64%,var(--peach) 64%);min-height:300px}
.pc-pet{width:min(78%,260px);animation:breathe 3s ease-in-out infinite}
.pc-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:min(92%,340px)}
.pc-name{font-size:30px;display:flex;align-items:baseline;gap:10px}
.pc-name span{font-size:17px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.pc-hint{font-size:18px;background:var(--berry);color:#fff;border-radius:999px;padding:6px 16px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.door{position:relative;overflow:hidden;text-align:left;padding:18px 18px 16px;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.door h2{margin:0;font-size:clamp(24px,2.8vw,30px)}
.door p{margin:0;font-size:17px;opacity:.85}
.door .dch{position:absolute;right:-8px;top:-6px;width:118px;transform:rotate(8deg)}
.door .dtag{position:absolute;left:16px;top:14px;font-size:15px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.door .dstk{position:absolute;right:14px;top:14px;display:flex;gap:2px;font-size:30px}

/* tabs + learn */
.tabs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tab{font-size:22px;padding:10px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--berry);color:#fff}
.tabs .sp{flex:1}
.quizbtn{font-size:22px;padding:10px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--butter);box-shadow:0 4px 0 var(--ink)}
.tab:active,.quizbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding-bottom:8px}
.lgrid.zy{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.lcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 8px;min-height:160px}
.lcard .big{font-size:64px;line-height:1}
.lcard .big.en{font-size:56px;letter-spacing:.02em}
.lcard .emo{font-size:40px;line-height:1.1}
.lcard .mini{font-size:20px;line-height:1.15;max-width:120px;text-align:center;word-break:break-all}
.lcard .lab{font-size:22px}
.lcard .lab small{display:block;font-size:15px;opacity:.75;text-align:center}
.lcard svg{width:92px;height:92px}
.lcard.hit{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.08) rotate(-3deg)}}

/* game */
.game{display:flex;flex-direction:column;gap:16px;flex:1}
.prog{display:flex;gap:10px;justify-content:center}
.prog i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:var(--card)}
.prog i.done{background:var(--good)}
.prog i.now{background:var(--butter);transform:scale(1.2)}
.gq{display:flex;align-items:center;gap:14px}
.gm{width:110px;flex:none}
.gbub{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:14px 16px 14px 22px;font-size:clamp(24px,3vw,32px);position:relative}
.gbub::before{content:"";position:absolute;left:-14px;top:50%;width:22px;height:22px;background:var(--card);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.gbub span{flex:1}
.show{display:flex;justify-content:center}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:620px;background:var(--card);border:3px dashed var(--ink);border-radius:24px;padding:14px 18px}
.pile button{font-size:54px;line-height:1;position:relative;padding:4px;border-radius:16px}
.pile button.counted{background:var(--mint)}
.pile button b{position:absolute;right:-4px;top:-6px;font-size:18px;background:var(--berry);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--ink)}
.opts{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:18px;max-width:900px;width:100%;margin:0 auto}
.opt{min-height:150px;display:grid;place-items:center;font-size:64px;padding:10px}
.opt.sm{min-height:118px;font-size:58px}
.opt .num{font-size:78px;line-height:1}
.opt .zy{font-size:80px;line-height:1}
.opt .en{font-size:76px;line-height:1}
.opt svg{width:min(120px,90%);height:auto}
.opt .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:40px;max-width:200px}
.opt.right{background:var(--mint);animation:pop .5s}
.opt.wrong{opacity:.45;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* quest home */
.qhome{display:flex;flex-direction:column;gap:20px;align-items:center;flex:1;justify-content:center}
.qhero{display:flex;align-items:center;gap:24px;padding:24px 30px;max-width:820px;width:100%;background:var(--butter)}
.qhero .ch{width:180px;flex:none;animation:breathe 3s ease-in-out infinite}
.qb{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.qb h2{margin:0;font-size:34px}
.qb p{margin:0;font-size:21px;line-height:1.5}
.qstat{font-size:20px}
.bigbtn{font-size:28px;padding:16px 28px;border-radius:999px;background:var(--berry);color:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);align-self:flex-start}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bigbtn.alt{background:var(--card);color:var(--ink)}
.qkinds{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:18px}
.qkinds span{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 14px}

/* stickers */
.sbook{padding:22px;background:var(--lilac)}
.sbook h2{margin:0 0 14px;font-size:26px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:52px;border:3px dashed #B49AC0;color:#B49AC0;background:rgba(255,255,255,.5);max-width:100%}
.slot.have{border:4px solid #fff;background:#fff;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px var(--ink);color:inherit}
.slot.q{font-size:34px}

/* pet */
.petpage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.room{position:relative;overflow:hidden;height:clamp(380px,calc(100vh - 120px),640px);background:linear-gradient(var(--roomsky,var(--sky)) 0 60%,var(--peach) 60%)}
.window{position:absolute;left:7%;top:8%;width:24%;aspect-ratio:1;background:#E9F7FF;border:3px solid var(--ink);border-radius:18px;max-width:100%}
.window::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid var(--ink)}
.window::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:3px solid var(--ink)}
.window i{position:absolute;right:12%;top:10%;font-size:28px;font-style:normal}
.shelf{position:absolute;right:7%;top:16%;font-size:34px;border-bottom:5px solid var(--ink);padding:0 6px}
.rug{position:absolute;left:50%;bottom:6%;width:62%;height:12%;transform:translateX(-50%);background:var(--berry);opacity:.35;border-radius:50%}
.petwrap{position:absolute;left:50%;bottom:8%;width:min(52%,300px);transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%;transition:transform .6s}
.petbody{position:relative;animation:breathe 3s ease-in-out infinite}
.petbody.jump{animation:jump .8s}
.petbody.nom{animation:nom .8s}
.petbody.wig{animation:wig .6s}
.acc{position:absolute;left:50%;transform:translateX(-50%);line-height:1;pointer-events:none}
.acc.head{top:-4%;font-size:clamp(40px,7vw,64px)}
.acc.face{top:44%;font-size:clamp(46px,8vw,74px)}
.acc.neck{bottom:-2%;font-size:clamp(40px,6.5vw,58px)}
.pbub{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:8px 18px;font-size:22px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.panel{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.pinfo{display:flex;align-items:center;gap:10px;font-size:28px;flex-wrap:wrap}
.lv{font-size:17px;background:var(--butter);border:2px solid var(--ink);border-radius:999px;padding:2px 12px}
.stat{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px;font-size:19px}
.bar{height:24px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .6s}
.panel h3{margin:4px 0 0;font-size:19px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 8px;min-width:76px;border-radius:18px;font-size:16px;box-shadow:0 4px 0 var(--ink)}
.act .e{font-size:32px;line-height:1.1}
.act .pr{font-size:15px;background:var(--butter);border-radius:999px;padding:0 8px}
.act.own .pr{background:var(--mint)}
.act.on{background:var(--mint)}

/* adopt */
.adopt{display:flex;flex-direction:column;align-items:center;gap:18px;flex:1;justify-content:center}
.adopt p{font-size:26px;margin:0;text-align:center}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;width:100%;max-width:880px}
.acard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px}
.acard .ch{width:80%}
.acard b{font-size:30px}
.acard span{font-size:18px}

/* modal + fx */
.mbg{position:fixed;inset:0;background:rgba(91,59,76,.45);display:grid;place-items:center;z-index:50;padding:16px}
.mcard{background:var(--card);border:3px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:26px 28px;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:popin .35s}
.mcard h2{margin:0;font-size:32px}
.mcard p{margin:0;font-size:21px;line-height:1.5}
.mcard .ch{width:150px}
.mcard .bigstk{font-size:110px;line-height:1;animation:spin 1s}
.mbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.mbtns .bigbtn{align-self:auto;font-size:22px;padding:12px 22px}
.danger{background:#E5484D !important;color:#fff !important}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@keyframes spin{from{transform:scale(.2) rotate(-180deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fl{position:absolute;font-size:34px;animation:floatUp 1.2s ease-out forwards;transform:translate(-50%,-50%)}
.fl.txt{font-size:30px;color:var(--berry);-webkit-text-stroke:1px #fff;font-weight:bold}
@keyframes floatUp{to{transform:translate(-50%,-160%);opacity:0}}
.fly{position:absolute;font-size:44px;transition:transform .65s cubic-bezier(.3,-.3,.6,1),opacity .65s;transform:translate(-50%,-50%)}
.cf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
@keyframes breathe{50%{transform:translateY(-6px) scale(1.02)}}
@keyframes jump{30%{transform:translateY(-70px) rotate(-8deg)}60%{transform:translateY(0) scaleY(.9)}80%{transform:translateY(-18px)}}
@keyframes nom{20%,60%{transform:scale(1.06,.94)}40%,80%{transform:scale(.96,1.04)}}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.ch{display:block;width:100%;height:auto;overflow:visible}


/* help */
.help{display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
.hsec{padding:22px 26px;display:flex;flex-direction:column;gap:12px}
.hsec h2{margin:0;font-size:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hsec h2 small{font-size:15px;background:var(--butter);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.hsec h3{margin:6px 0 0;font-size:20px}
.hsec p,.hsec li{font-size:18px;line-height:1.7;margin:0;max-width:62em}
.hsec ol,.hsec ul{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.hsec code{font-family:ui-monospace,Menlo,monospace;font-size:15px;background:var(--bg);border:1px solid #E6C8D5;border-radius:6px;padding:1px 6px;word-break:break-all}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.hcard{border:2px solid var(--ink);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.hcard b{font-size:20px}
.hcard p{font-size:16px;line-height:1.6}
.htable{overflow-x:auto}
.htable table{border-collapse:collapse;font-size:17px;min-width:420px}
.htable th,.htable td{border:2px solid var(--ink);padding:6px 12px;text-align:left}
.htable th{background:var(--butter)}
.htable td.n{font-variant-numeric:tabular-nums;text-align:center}
.helplink{align-self:center;font-size:18px;padding:8px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--card)}

/* recorder */
.recintro{padding:16px 22px;display:flex;flex-direction:column;gap:6px}
.recintro p{margin:0;font-size:18px;line-height:1.6}
.note{font-size:16px !important;opacity:.85}
.warn{background:#FFE3E3;border:2px solid #E5484D;border-radius:12px;padding:8px 12px}
.reclist{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.recrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;box-shadow:0 4px 0 var(--ink);text-align:left}
.recrow.live{background:#FFE3EC}
.vrow{grid-template-columns:minmax(0,1fr) auto}
.rl{font-size:22px;display:flex;align-items:center;gap:8px;min-width:0}
.rs{font-size:18px;min-width:0}
.zyl{font-size:30px}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink)}
.chip{font-size:15px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:#fff;white-space:nowrap}
.chip.ok{background:var(--mint)}
.rb{display:flex;gap:8px}
.rbtn{font-size:17px;padding:10px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--card);white-space:nowrap}
.rbtn.rec{background:var(--butter)}
.rbtn.rec.on{background:#E5484D;color:#fff;animation:bump 1s infinite}
.rbtn:disabled{opacity:.35}
@media (max-width:820px){ .recrow{grid-template-columns:minmax(0,1fr) auto} .recrow .rs{grid-column:1/-1} .recrow .rb{grid-column:1/-1} }

@media (max-width:820px){
  .home,.petpage{grid-template-columns:1fr}
  .petcard{min-height:240px}
  .room{height:360px}
}
@media (max-width:520px){
  .doors{grid-template-columns:1fr}
  .opt{min-height:110px;font-size:48px}
  .opt .num,.opt .zy,.opt .en{font-size:56px}
  .gm{width:76px}
  .qhero{flex-direction:column;text-align:center}
  .qhero .ch{width:130px}
  .bigbtn{align-self:center}
  .agrid{gap:10px}
  .top h1{font-size:20px}
  .pill{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- themes (skins) ---------- */
body[data-skin="dino"]{--bg:#F0F7E6;--berry:#E46F3A;--mint:#CDEBB5;--butter:#FFE29A;--pink:#F7CDAE;--lilac:#DCEBC8;--sky:#CFEAF5;--peach:#E7D3AE;--dot:#DCEAC6}
body[data-skin="space"]{--bg:#EEF1FB;--berry:#FF7A59;--mint:#C9E4FF;--butter:#FFE08A;--pink:#FFCFC2;--lilac:#DAD3FF;--sky:#CFDAFF;--roomsky:#34407A;--peach:#B9C3E6;--dot:#D8DEF5}
body[data-skin="space"] .window{background:#1F2752}
body[data-skin="race"]{--bg:#F4F3EE;--berry:#E63946;--mint:#BFE3D0;--butter:#FFD166;--pink:#FFC9B9;--lilac:#D6DCE8;--sky:#BFD9F2;--peach:#C9CBD2;--dot:#E3E1D9}

/* ---------- home extras ---------- */
.lvchip{font-size:16px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;white-space:nowrap}

/* ---------- game extras ---------- */
.eq{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--card);border:3px dashed var(--ink);border-radius:24px;padding:14px 18px;max-width:900px}
.eq .grp{display:flex;flex-wrap:wrap;gap:2px;font-size:42px;max-width:260px;justify-content:center}
.eq b{font-size:52px}
.eq .gone{opacity:.25;position:relative}
.eq .gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#E5484D;font-size:38px;opacity:1}
.eq .bal{width:90px}
.seqrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--card);border:3px dashed var(--ink);border-radius:24px;padding:14px 18px}
.seqrow .pi{width:64px;height:64px;display:grid;place-items:center}
.seqrow .pi svg{width:100%;height:100%}
.seqrow .pi.q{font-size:48px;border:3px dashed var(--ink);border-radius:16px}
.seqrow .nb{font-size:54px;min-width:70px;height:80px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:18px;background:var(--bg);font-variant-numeric:tabular-nums}
.seqrow .nb.q{border-style:dashed;background:var(--card)}
.bigemo{font-size:110px;line-height:1;text-align:center}
.bigemo.sm{font-size:84px}
.opt .zy2{font-size:58px;line-height:1;letter-spacing:.04em}
.opt .lc{font-size:80px;line-height:1;font-family:ui-rounded,"Arial Rounded MT Bold",var(--font)}
.spellbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.slots{display:flex;gap:12px}
.slot2{width:76px;height:86px;border:3px dashed var(--ink);border-radius:18px;background:var(--card);display:grid;place-items:center;font-size:60px;font-family:ui-rounded,"Arial Rounded MT Bold",var(--font)}
.slot2.fill{border-style:solid;background:var(--mint);animation:pop .4s}
.opt.tile{min-height:110px;font-size:64px;font-family:ui-rounded,"Arial Rounded MT Bold",var(--font)}
.opt.tile.used{opacity:.3}
.opt.shk{animation:shake .4s}

/* ---------- learn extras ---------- */
.ghead{grid-column:1/-1;margin:8px 0 0;font-size:22px}
.lcard .big.mid{font-size:40px}
.lcard .mini.dense{font-size:14px;max-width:130px}
.lcard .words{font-size:16px;line-height:1.35;text-align:center}
.lcard .swatch{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink)}

/* ---------- trace ---------- */
.tsets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tbox{display:flex;align-items:center;justify-content:center;gap:14px}
.tcanvas{width:min(60vh,520px,calc(100vw - 180px));aspect-ratio:1;padding:0;overflow:hidden;max-width:100%}
.tcanvas canvas{width:100%;height:100%;display:block;touch-action:none}
.trow{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.tmsg{font-size:20px;min-height:1.4em;text-align:center}

/* ---------- settings ---------- */
.sets{display:flex;flex-direction:column;gap:18px;padding-bottom:24px}
.setsec{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.setsec h2{margin:0;font-size:24px}
.setsec p{margin:0;font-size:17px;line-height:1.6}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:22px;text-align:center}
.choice .ch{width:90px}
.choice b{font-size:21px}
.choice span{font-size:15px;line-height:1.5}
.choice.on{background:var(--mint);box-shadow:0 0 0 4px var(--berry),0 6px 0 var(--ink)}
.setbtns{display:flex;flex-wrap:wrap;gap:12px}
.setbtns .bigbtn{font-size:20px;padding:10px 20px;align-self:auto}
.toggle{display:flex;align-items:center;gap:10px;font-size:18px}
.toggle .sw{width:62px;height:34px;border-radius:999px;border:3px solid var(--ink);background:#fff;position:relative;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .2s}
.toggle.on .sw{background:var(--good)}
.toggle.on .sw::after{left:31px;background:#fff}
@media (max-width:620px){.choices{grid-template-columns:1fr}.tcanvas{width:calc(100vw - 150px)}}

/* ---------- pet family ---------- */
.family{display:flex;gap:12px;overflow-x:auto;padding:10px 4px 12px;-webkit-overflow-scrolling:touch}
.fam{flex:none;width:118px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 8px;border-radius:20px;position:relative;box-shadow:0 4px 0 var(--ink)}
.fam .ch{width:66px}
.fam b{font-size:18px}
.fam span{font-size:14px;text-align:center}
.fam.on{background:var(--mint);box-shadow:0 0 0 3px var(--berry),0 4px 0 var(--ink)}
.ptag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-style:normal;font-size:13px;background:var(--berry);color:#fff;border-radius:999px;padding:1px 10px;border:2px solid var(--ink);white-space:nowrap}
.fam.add{justify-content:center;background:var(--butter)}
.fam.add.locked{background:#EFE8EC}
.fam .plus{font-size:40px;line-height:1.1}
.room{height:clamp(360px,calc(100vh - 300px),560px) !important;background:linear-gradient(var(--roomsky,var(--sky)) 0 60%,var(--floor,var(--peach)) 60%) !important}
.petwrap.gold .petbody,.lvfig.gold .petbody{filter:drop-shadow(0 0 8px #FFD54A) drop-shadow(0 0 3px #FFB300)}
.lvfig{width:170px;position:relative;margin-top:10px}
.lvfig .ch{width:100% !important}
.halo{position:absolute;left:50%;top:-17%;width:40%;height:8%;transform:translateX(-50%);border:5px solid #FFD54A;border-radius:50%;box-shadow:0 0 10px #FFE58F;z-index:2;pointer-events:none}
.halo.rb{border-color:#FF7AB6;box-shadow:0 0 0 3px #FFD54A,0 0 0 6px #7FD3B8,0 0 0 9px #7CC2F0}
.spk{position:absolute;font-size:clamp(20px,3.4vw,32px);animation:twk 2s ease-in-out infinite;pointer-events:none;line-height:1}
.spk.k1{left:-8%;top:22%}
.spk.k2{right:-8%;top:6%;animation-delay:.6s}
.spk.k3{right:0;bottom:14%;animation-delay:1.2s}
@keyframes twk{50%{transform:scale(1.35) rotate(15deg);opacity:.55}}
.expnote{margin:0;font-size:14px;opacity:.85;line-height:1.5}
.act.lock{opacity:.55}
.adopt{justify-content:flex-start !important}
.athead{margin:6px 0 0;font-size:22px;width:100%;max-width:880px}
.acard.owned{opacity:.5;box-shadow:none}
.famhead{margin:14px 0 0;font-size:20px}
.petleft{min-width:0;display:flex;flex-direction:column}
.family{flex-wrap:wrap;overflow:visible}

let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){} }
if('speechSynthesis' in window){ loadVoices(); try{ speechSynthesis.onvoiceschanged = loadVoices; }catch(e){} }
function zhVoices(){ return voices.filter(v=>/^zh|cmn/i.test(v.lang)); }
function voiceScore(v){
  let sc=0; const n=v.name+' '+v.lang;
  if(/tw|hant/i.test(v.lang)) sc+=5;
  if(/premium|enhanced|加強|高品質|進階|neural|natural|online/i.test(n)) sc+=4;
  if(/compact|精簡/i.test(n)) sc-=2;
  return sc;
}
function pickVoice(lang){
  const norm = v => v.lang.toLowerCase().replace('_','-');
  if(lang.startsWith('zh')){
    if(S.voice){ const m=voices.find(v=>v.name===S.voice); if(m) return m; }
    return zhVoices().slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
  }
  const sc = v => (/en-us/i.test(norm(v))?1:0) + (/premium|enhanced|natural/i.test(v.name)?2:0);
  return voices.filter(v=>norm(v).startsWith('en')).sort((a,b)=>sc(b)-sc(a))[0];
}
function stopAudio(){ try{ if(AUD.el) AUD.el.pause(); }catch(e){} }
function say(...parts){
  if(!S.sound || !('speechSynthesis' in window)) return;
  stopAudio();
  try {
    speechSynthesis.cancel();
    parts.forEach(p=>{
      const [t,lang='zh-TW'] = Array.isArray(p) ? p : [p];
      if(!t) return;
      const u = new SpeechSynthesisUtterance(t);
      u.lang = lang; const v = pickVoice(lang); if(v) u.voice = v;
      u.rate = lang.startsWith('en') ? Math.min(S.rate,.85) : S.rate; u.pitch = 1;
      speechSynthesis.speak(u);
    });
  } catch(e){}
}

const AUD = {db:null, urls:new Map(), el:null};
function idb(){
  return new Promise((res,rej)=>{
    if(AUD.db) return res(AUD.db);
    try{
      const r=indexedDB.open('yunduo-audio',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('clips');
      r.onsuccess=()=>{AUD.db=r.result;res(AUD.db);};
      r.onerror=()=>rej(r.error);
    }catch(e){rej(e);}
  });
}
async function loadClips(){
  try{
    const db=await idb();
    await new Promise(res=>{
      const req=db.transaction('clips').objectStore('clips').openCursor();
      req.onsuccess=()=>{ const c=req.result; if(c){ AUD.urls.set(c.key, URL.createObjectURL(c.value)); c.continue(); } else res(); };
      req.onerror=()=>res();
    });
  }catch(e){}
}
async function clipSave(k,blob){
  try{ const db=await idb(); await new Promise((res,rej)=>{ const tx=db.transaction('clips','readwrite'); tx.objectStore('clips').put(blob,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){}
  const old=AUD.urls.get(k); if(old) URL.revokeObjectURL(old);
  AUD.urls.set(k, URL.createObjectURL(blob));
}
async function clipDel(k){
  try{ const db=await idb(); await new Promise(res=>{ const tx=db.transaction('clips','readwrite'); tx.objectStore('clips').delete(k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){}
  const old=AUD.urls.get(k); if(old) URL.revokeObjectURL(old); AUD.urls.delete(k);
}

}

let ac;
function tone(freqs,dur=.12,type='sine',gap=.09){
  if(!S.sound) return;
  try {
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t = ac.currentTime;
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), s=t+i*gap;
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.16,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+dur);
      o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+dur+.05);
    });
  } catch(e){}
}

function starPts(cx,cy,R,r){ let p=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1)); } return p.join(' '); }

function floatAt(txt,x,y,cls=''){
  const s=document.createElement('span'); s.className='fl '+cls; s.textContent=txt;
  s.style.left=x+'px'; s.style.top=y+'px'; fx.appendChild(s); setTimeout(()=>s.remove(),1300);
}
function centerOf(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function confetti(n=48){
  const cols=['#F06C9B','#FFD43B','#7FD3B8','#7CC2F0','#C3A5F7','#FF9F43'];
  for(let i=0;i<n;i++){
    const s=document.createElement('i'); s.className='cf';
    s.style.left=Math.random()*100+'vw'; s.style.background=pick(cols);
    s.style.animationDelay=(Math.random()*.4)+'s'; s.style.animationDuration=(1.6+Math.random()*1.3)+'s';
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    fx.appendChild(s); setTimeout(()=>s.remove(),3500);
  }
}
function addStars(n,el){
  S.stars+=n; save();
  document.querySelectorAll('.star-count').forEach(b=>{ b.textContent=S.stars; b.parentElement.classList.remove('bump'); void b.offsetWidth; b.parentElement.classList.add('bump'); });

}

function recordHist(ok){
  S.hist.push(!!ok); if(S.hist.length>20) S.hist.shift();
  if(!S.autoLv || S.hist.length<15){ save(); return; }
  const rate=S.hist.filter(Boolean).length/S.hist.length;
  if(rate>=.8 && S.level<3) S.sug='up';
  else if(rate<.4 && S.level>1) S.sug='down';
  save();
}

/* ===================== 題目產生器 ===================== */
const opt = (html,ok,sayTxt) => ({html,ok,say:sayTxt});
const numOpt = v => `<span class="num">${v}</span>`;
function numChoices(ans, lo, hi, n=3){ const pool=range(lo,hi).filter(v=>v!==ans); return shuffle([ans,...shuffle(pool).slice(0,n-1)]); }
const GEN = {
  count(){
    const max=S.level===1?5:10, n=1+rnd(max), f=pick(FRUITS);
    return {text:`數一數，有幾個${f.n}？`, say:[`數一數，有幾個${f.n}？`],
      show:`<div class="pile">${Array.from({length:n},()=>`<button data-act="cnt">${f.e}</button>`).join('')}</div>`,
      opts:numChoices(n,1,Math.max(max,5)).map(v=>opt(numOpt(v),v===n,ZH[v-1])), cols:3};
  },
  compare(){
    const max=S.level>=3?20:10; let a=1+rnd(max), b=1+rnd(max); while(a===b) b=1+rnd(max);
    return {text:'哪一個數字比較大？', say:['哪一個數字比較大？'], opts:[a,b].map(v=>opt(numOpt(v),v===Math.max(a,b),ZH[v-1])), cols:2};
  },
  more(){
    const a=1+rnd(6); let b=1+rnd(6); while(b===a) b=1+rnd(6);
    const e=pick(FRUITS).e;
    return {text:'哪一邊比較多？', say:['哪一邊比較多？'],
      opts:[opt(`<div class="grp">${e.repeat(a)}</div>`,a>b), opt(`<div class="grp">${e.repeat(b)}</div>`,b>a)], cols:2};
  },
  add(){
    const a=1+rnd(5), b=1+rnd(5), f=pick(FRUITS), s=a+b;
    return {text:`${a} ＋ ${b} ＝ ？`, say:[`${zhc(a)}個${f.n}，再加${zhc(b)}個，一共有幾個？`],
      show:`<div class="eq"><span class="grp">${f.e.repeat(a)}</span><b>＋</b><span class="grp">${f.e.repeat(b)}</span><b>＝</b><b>？</b></div>`,
      opts:numChoices(s,2,10).map(v=>opt(numOpt(v),v===s,ZH[v-1])), cols:3};
  },
  sub(){
    const a=3+rnd(7), b=1+rnd(a-1), f=pick(FRUITS), d=a-b;
    return {text:`${a} － ${b} ＝ ？`, say:[`${zhc(a)}個${f.n}，吃掉${zhc(b)}個，還剩幾個？`],
      show:`<div class="eq"><span class="grp">${Array.from({length:a},(_,i)=>`<span class="${i>=a-b?'gone':''}">${f.e}</span>`).join('')}</span><b>＝</b><b>？</b></div>`,
      opts:numChoices(d,1,9).map(v=>opt(numOpt(v),v===d,ZH[v-1])), cols:3};
  },
  seq(){

let G = null;

function gameView(){
  const q=G.qs[G.i];
  let mid, opts;
  if(q.type==='spell'){
    mid = `<div class="spellbox"><div class="bigemo">${q.emoji}</div><div class="slots">${q.word.split('').map((_,i)=>`<span class="slot2" id="sl${i}"></span>`).join('')}</div></div>`;

  } else {
    mid = q.show?`<div class="show">${q.show}</div>`:'';
    opts = `<div class="opts" style="--cols:${q.cols}">${q.opts.map((o,j)=>`<button class="stk opt ${q.cls||''}" data-act="ans" data-j="${j}">${o.html}</button>`).join('')}</div>`;
  }
  render(`${topBar(G.title, G.back)}
  <main class="game">
    <div class="prog">${G.qs.map((_,j)=>`<i class="${j<G.i?'done':j===G.i?'now':''}"></i>`).join('')}</div>
    <div class="gq"><div class="gm" id="gm">${charSVG(G.m)}</div>
      <div class="gbub"><span>${q.text}</span><button class="ibtn" data-act="replay" aria-label="再聽一次">🔊</button></div></div>
    ${mid}${opts}
  </main>`);
  G.cnt=0; G.lock=false;
  if(!(q.key && playClip(q.key))) say(...q.say);
}
function correct(btn, q, sayFn){
  G.lock=true; sfx.ok();
  $('#gm').innerHTML=charSVG(G.m,'happy');
  G.earned+=starPer(); addStars(starPer(),btn); gainExp(1);
  const recP=PRAISE.map((_,i)=>'praise-'+i).filter(hasClip);
  if(recP.length) playClip(pick(recP)); else sayFn(pick(PRAISE));
  setTimeout(()=>{ G.i++; if(G.i<G.qs.length) gameView(); else G.onDone(G.earned); },1600);
}
function answer(btn){
  if(G.lock || btn.disabled) return;
  const q=G.qs[G.i], o=q.opts[+btn.dataset.j];
  if(!q.tried){ q.tried=true; recordHist(o.ok); }
  if(o.ok){
    btn.classList.add('right');
    correct(btn, q, praise=>{
      if(q.sayAfter) say(q.sayAfter, praise);
      else if(q.en) say([q.en,'en-US'], o.say||'', praise);
      else say(o.say?o.say+'！':'', praise);
    });
  } else {
    btn.disabled=true; btn.classList.add('wrong'); sfx.no();
    speak('retry-0', RETRY);
  }
}
function tileTap(btn){
  const q=G.qs[G.i]; if(G.lock || btn.classList.contains('used')) return;
  const l=q.tiles[+btn.dataset.j];
  if(l===q.word[q.pos]){
    btn.classList.add('used'); btn.disabled=true;
    const sl=$('#sl'+q.pos); sl.textContent=l; sl.classList.add('fill');
    q.pos++; sfx.pop(); say([l,'en-US']);
    if(q.pos===q.word.length){
      if(!q.tried){ q.tried=true; recordHist(true); }
      correct(btn, q, praise=>say([q.word,'en-US'], praise));
    }
  } else {
    if(!q.tried){ q.tried=true; recordHist(false); }
    btn.classList.remove('shk'); void btn.offsetWidth; btn.classList.add('shk'); sfx.no();
  }
}

const P = () => (S.pets||[]).find(p=>p.kind===S.partner) || null;
function lvOf(p){ const x=p?p.exp:0; let l=0; LV.forEach(t=>{ if(x>=t) l++; }); return Math.max(1,l); }
function level(){ return lvOf(P()); }
function maxLv(){ return S.pets.length ? Math.max(...S.pets.map(lvOf)) : 0; }
function badges(p){ const l=lvOf(p); return (l>=10?'🏅':'')+(l>=15?'🏆':'')+(l>=20?'👑':''); }
function accOpen(a){ return a.lvl ? maxLv()>=a.lvl : S.closet.includes(a.id); }
function roomOpen(r){ return maxLv()>=r.lv; }
function newest(){ return S.pets[S.pets.length-1]; }
function canAdopt(){
  if(!S.pets.length) return true;
  if(S.pets.length>=Object.keys(CH).length) return false;
  return lvOf(newest())>=ADOPT_LV;
}
function decay(){
  const p=P(); if(!p) return;
  const now=Date.now(), h=(now-(p.t||now))/3.6e6;
  if(h>0){ p.full=Math.max(20,p.full-h*4); p.happy=Math.max(20,p.happy-h*3); }
  p.t=now; save();
}
function gainExp(n){
  const p=P(); if(!p || n<=0) return;
  const b=lvOf(p); p.exp+=n; const a=lvOf(p);
  if(a>b) S.lvq={kind:p.kind, lv:a};
  save();
}
function petMsg(){
  const p=P();
  if(p.full<45) return '肚子有點餓了…';
  if(p.happy<45) return '想跟你一起玩！';
  if(lvOf(p)<MAXLV) return pick(['今天好開心！','你答對題目，我就會長大喔！','我好喜歡你！','我們去學習吧！']);
  return pick(['我是宇宙無敵的寵物！','謝謝你一直照顧我！']);
}
function petScale(p){ const l=lvOf(p); return (l<=5 ? .8+.07*(l-1) : Math.min(1.15, 1.08+.008*(l-5))).toFixed(3); }
function accFor(wear){
  wear=wear||{};
  return ['head','face','neck'].map(s=>{ const a=ACCS.find(x=>x.id===wear[s]); return a?`<span class="acc ${s}">${a.e}</span>`:''; }).join('');
}
function petInner(p, mood){
  const l=lvOf(p);
  const spk = l>=6 ? `<span class="spk k1">${l>=19?'🌟':'✨'}</span><span class="spk k2">${l>=19?'🌟':'✨'}</span><span class="spk k3">✨</span>` : '';
  const halo = l>=8 ? `<span class="halo ${l>=14?'rb':''}"></span>` : '';
  return halo + charSVG(p.kind,mood) + accFor(p.wear) + spk;
}
function lvClass(p){ return lvOf(p)>=10 ? 'gold' : ''; }
function showLvUp(){
  const q=S.lvq; S.lvq=null; save();
  const p=S.pets.find(x=>x.kind===q.kind); if(!p) return;
  const c=CH[q.kind], unlockAdopt = q.lv===ADOPT_LV && newest()===p && S.pets.length<Object.keys(CH).length;

    <div class="mbtns"><button class="bigbtn" data-act="go" data-to="pet">去寵物家族</button><button class="bigbtn alt" data-act="close">好</button></div>`);
}
function adoptView(){
  applySkin();

const TR = {set:'upper', idx:{num:0,upper:0,lower:0,zy:0}, done:new Set(), ink:null, strokes:false};
const TSETS = {
  num:{n:'數字', list:'0123456789'.split('')},
  upper:{n:'大寫', list:ABC.map(a=>a.L)},
  lower:{n:'小寫', list:ABC.map(a=>a.L.toLowerCase())},
  zy:{n:'注音', list:ZY.map(z=>z.z)}
};
const NUM0 = ['零','一','二','三','四','五','六','七','八','九'];
function traceGlyph(){ const L=TSETS[TR.set].list; return L[TR.idx[TR.set]%L.length]; }
function traceSay(){
  const g=traceGlyph();
  if(TR.set==='num') say(NUM0[+g]);
  else if(TR.set==='zy'){ const z=ZY.find(x=>x.z===g); speak(`zy-${ZY.indexOf(z)}`, z.s); }
  else say([g.toUpperCase(),'en-US']);
}
function traceHTML(){
  return `<div class="tsets">${Object.keys(TSETS).map(k=>`<button class="tab" aria-selected="${k===TR.set}" data-act="tset" data-k="${k}">${TSETS[k].n}</button>`).join('')}</div>
  <div class="tbox">
    <button class="ibtn" data-act="tmove" data-d="-1" aria-label="上一個">⬅</button>
    <div class="stk tcanvas"><canvas id="tc" aria-label="描字板"></canvas></div>
    <button class="ibtn" data-act="tmove" data-d="1" aria-label="下一個">➡</button>
  </div>
  <div class="trow"><button class="quizbtn" data-act="tclear">🧽 擦掉重寫</button><button class="quizbtn" data-act="tsay">🔊 念念看</button></div>
  <div class="tmsg" id="tmsg">用手指沿著淡淡的字描一次</div>`;
}
function traceInit(){
  TR.ink=null;
  const cv=$('#tc'); if(!cv) return;
  const draw=()=>{
    const css=cv.clientWidth||400, dpr=Math.min(2,window.devicePixelRatio||1), N=Math.round(css*dpr);
    cv.width=N; cv.height=N;
    const g=traceGlyph(), ctx=cv.getContext('2d');
    const fam=getComputedStyle(document.body).fontFamily;
    const isUpperOrNum = TR.set==='upper'||TR.set==='num';
    const font=`${Math.round(N*(isUpperOrNum?.72:.68))}px ${fam}`;
    const y=N*(TR.set==='lower'?.5:.54);
    ctx.clearRect(0,0,N,N);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,N,N);
    ctx.strokeStyle='#EADDE4'; ctx.lineWidth=2*dpr; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(0,N/2); ctx.lineTo(N,N/2); ctx.moveTo(N/2,0); ctx.lineTo(N/2,N); ctx.stroke();
    ctx.font=font; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#F3DCE6'; ctx.fillText(g,N/2,y);
    ctx.setLineDash([6*dpr,6*dpr]); ctx.strokeStyle='#C49AAE'; ctx.lineWidth=2*dpr; ctx.strokeText(g,N/2,y); ctx.setLineDash([]);
    // 遮罩
    const mk=()=>{ const c=document.createElement('canvas'); c.width=N; c.height=N; const x=c.getContext('2d'); x.font=font; x.textAlign='center'; x.textBaseline='middle'; return [c,x]; };
    const [mf,mfx]=mk(); mfx.fillStyle='#000'; mfx.fillText(g,N/2,y);
    const [mt,mtx]=mk(); mtx.fillStyle='#000'; mtx.strokeStyle='#000'; mtx.lineWidth=N*.09; mtx.lineJoin='round'; mtx.fillText(g,N/2,y); mtx.strokeText(g,N/2,y);
    const step=Math.max(4,Math.round(N/90)), fd=mfx.getImageData(0,0,N,N).data, td=mtx.getImageData(0,0,N,N).data, pts=[];
    for(let yy=0;yy<N;yy+=step) for(let xx=0;xx<N;xx+=step){ if(fd[(yy*N+xx)*4+3]>40) pts.push(yy*N+xx); }
    const [uc,ucx]=mk(); ucx.lineCap='round'; ucx.lineJoin='round'; ucx.lineWidth=N*.08; ucx.strokeStyle='#000';
    TR.ink={cv,ctx,N,dpr,step,pts,td,uc,ucx,last:null,count:0};
  };
  const ready = (document.fonts && document.fonts.load) ? document.fonts.load('100px Huninn').catch(()=>{}) : Promise.resolve();
  ready.then(draw);
  const pos=e=>{ const r=cv.getBoundingClientRect(), k=TR.ink.N/r.width; return [(e.clientX-r.left)*k,(e.clientY-r.top)*k]; };
  const line=(a,b)=>{ const I=TR.ink, c=I.ctx;
    c.lineCap='round'; c.lineJoin='round'; c.lineWidth=I.N*.06; c.strokeStyle=getComputedStyle(document.body).getPropertyValue('--berry').trim()||'#F06C9B';
    c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
    I.ucx.beginPath(); I.ucx.moveTo(a[0],a[1]); I.ucx.lineTo(b[0],b[1]); I.ucx.stroke(); };
  cv.addEventListener('pointerdown',e=>{ if(!TR.ink) return; e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){} const p=pos(e); TR.ink.last=p; line(p,[p[0]+.1,p[1]+.1]); });
  cv.addEventListener('pointermove',e=>{ if(!TR.ink||!TR.ink.last) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; evs.forEach(ev=>{ const p=pos(ev); line(TR.ink.last,p); TR.ink.last=p; }); });
  const end=()=>{ if(!TR.ink||!TR.ink.last) return; TR.ink.last=null; traceCheck(); };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
}
function traceCheck(){
  const I=TR.ink, ud=I.ucx.getImageData(0,0,I.N,I.N).data;
  let cov=0; I.pts.forEach(i=>{ if(ud[i*4+3]>40) cov++; });
  let ink=0, out=0;
  for(let y=0;y<I.N;y+=I.step) for(let x=0;x<I.N;x+=I.step){ const i=y*I.N+x; if(ud[i*4+3]>40){ ink++; if(I.td[i*4+3]<=40) out++; } }
  const coverage=I.pts.length?cov/I.pts.length:0, outside=ink?out/ink:1;
  const msg=$('#tmsg');
  if(coverage>=.6 && outside<.3){
    const key=TR.set+':'+traceGlyph();
    sfx.win(); confetti(24);
    const recP=PRAISE.map((_,i)=>'praise-'+i).filter(hasClip);
    if(recP.length) playClip(pick(recP)); else say(pick(PRAISE));
    if(!TR.done.has(key)){ TR.done.add(key); addStars(starPer(), I.cv); gainExp(1); }
    if(msg) msg.textContent='描得好棒！馬上換下一個～';
    I.last=null; TR.ink=null;
    setTimeout(()=>{ if($('#tc')){ TR.idx[TR.set]++; learn('cards'); traceSay(); } },1800);
  } else if(msg){
    msg.textContent = outside>=.3 ? '有一點跑出去了，沿著淡淡的字描描看' : coverage>.25 ? '快好了！把整個字都描完' : '用手指沿著淡淡的字描一次';
  }
}

function micOff(){

  clearTimeout(REC.timer);
  if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream=null; }
}
async function recToggle(key){
  if(REC.active){ const same=REC.active.key===key; try{ REC.active.mr.stop(); }catch(e){} if(same) return; }
  if(!recSupported()){ modal(`<h2>沒辦法錄音</h2><p>請用 iPad 的 Safari 打開 GitHub 上的網址，再到這裡錄音。</p><div class="mbtns"><button class="bigbtn" data-act="close">好</button></div>`); return; }
  try{
    stopAudio(); try{ speechSynthesis.cancel(); }catch(e){}
    if(!REC.stream) REC.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t))||'';
    const mr=new MediaRecorder(REC.stream, type?{mimeType:type}:undefined);
    const chunks=[];
    mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop=async()=>{
      clearTimeout(REC.timer);
      const blob=new Blob(chunks,{type:mr.mimeType||type||'audio/mp4'});
      REC.active=null;
      if(blob.size>800){ await clipSave(key,blob); playClip(key,true); }
      rec();
    };
    mr.start(); REC.active={key,mr};
    REC.timer=setTimeout(()=>{ try{ mr.stop(); }catch(e){} },6000);
    rec();
  }catch(e){
    micOff();
    modal(`<h2>需要麥克風權限</h2><p>請在跳出的視窗按「允許」。如果之前按了不允許，請到 iPad「設定 → Safari → 麥克風」改成「詢問」或「允許」。</p><div class="mbtns"><button class="bigbtn" data-act="close">好</button></div>`);
  }
}

/* ===================== 事件 ===================== */
const ACT = {
  go(b){ sfx.tap(); const to=b.dataset.to; if(to!=='rec') micOff(); if(to!=='settings'){ resetAsk=false; removeAsk=''; }
    ({home, pet, quest, stickers, help, rec, voice, settings, adopt:adoptView, town:()=>learn('town'), cards:()=>learn('cards')})[to](); },
  sound(b){ S.sound=!S.sound; save(); b.textContent=S.sound?'🔊':'🔇'; if(!S.sound){ try{speechSynthesis.cancel();}catch(e){} stopAudio(); } else say('聲音打開了'); },
  close(){ closeModal(); },
  gift(){ addStars(5); settings(); },
  reset(){ resetAsk=true; settings(); },
  resetNo(){ resetAsk=false; settings(); },
  resetYes(){ const keep={sound:S.sound, voice:S.voice, rate:S.rate, theme:S.theme, level:S.level, autoLv:S.autoLv};
    try{localStorage.removeItem(KEY);}catch(e){} S=load(); Object.assign(S,keep); save(); resetAsk=false; home(); },
  setTheme(b){ S.theme=b.dataset.k; save(); applySkin(); sfx.pop(); settings(); },
  setLevel(b){ S.level=+b.dataset.l; S.hist=[]; S.sug=''; save(); sfx.pop(); settings(); },
  autoLv(){ S.autoLv=!S.autoLv; S.hist=[]; S.sug=''; save(); settings(); },
  sugYes(){ S.level=Math.max(1,Math.min(3,S.level+(S.sug==='up'?1:-1))); S.sug=''; S.hist=[]; save(); sfx.win(); confetti(); home(); },
  sugNo(){ S.sug=''; S.hist=[]; save(); closeModal(); },
  tab(b){ sfx.tap(); curTab[b.dataset.w]=b.dataset.t; learn(b.dataset.w); },
  item(b){ sfx.pop(); b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit'); sayItem(b.dataset.t, +b.dataset.i); },
  wordItem(b){ sfx.pop(); b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit'); const w=WORDS[b.dataset.c].list[+b.dataset.i]; say([w.en,'en-US'], w.zh); },
  quiz(b){ const w=b.dataset.w, t=b.dataset.t, kinds=TAB_QUIZ[t][S.level-1];
    startGame({title:WORLDS[w].title()+'・小測驗', back:w, m:w==='town'?TH().chars[1]:TH().chars[0], qs:Array.from({length:5},()=>GEN[pick(kinds)]()), onDone:quizDone(w,t)}); },
  replay(){ const q=G&&G.qs[G.i]; if(q && !(q.key && playClip(q.key))) say(...q.say); },
  ans(b){ answer(b); },
  tile(b){ tileTap(b); },
  cnt(b){ if(b.classList.contains('counted')) return; G.cnt++; b.classList.add('counted'); b.insertAdjacentHTML('beforeend',`<b>${G.cnt}</b>`); sfx.pop(); say(ZH[G.cnt-1]||String(G.cnt)); },
  startQuest(){ sfx.tap(); startQuest(); },
  stkTap(b){ sfx.pop(); const [x,y]=centerOf(b); floatAt('✨',x,y); },
  tset(b){ TR.set=b.dataset.k; learn('cards'); traceSay(); },
  tmove(b){ const L=TSETS[TR.set].list; TR.idx[TR.set]=(TR.idx[TR.set]+(+b.dataset.d)+L.length)%L.length; learn('cards'); traceSay(); },
  tclear(){ learn('cards'); },
  tsay(){ traceSay(); },
  recTab(b){ REC.tab=b.dataset.t; rec(); },
  recDo(b){ recToggle(b.dataset.k); },
  recPlay(b){ playClip(b.dataset.k,true); },
  async recDel(b){ await clipDel(b.dataset.k); rec(); },
  rate(b){ S.rate=+b.dataset.v; save(); voice(); say('你好，我們一起來學習吧！'); },
  pickVoice(b){ S.voice=decodeURIComponent(b.dataset.n); save(); voice(); say('你好，我們一起來學習吧！'); },
  adopt(b){ const k=b.dataset.k; if(!canAdopt() || S.pets.some(p=>p.kind===k)) return;
    S.pets.push({kind:k, exp:0, full:70, happy:70, t:Date.now(), wear:{}}); S.partner=k; save();
    sfx.win(); confetti(); pet(); say(`你好！我是${CH[k].name}，請多多照顧我！`); },
  partner(b){ const k=b.dataset.k; if(k===S.partner){ sfx.pop(); return; }
    S.partner=k; P().t=Date.now(); save(); sfx.pop(); pet(); say(`換${CH[k].name}來陪你囉！`); },
  room(b){ const r=ROOMS.find(x=>x.id===b.dataset.id);
    if(!roomOpen(r)){ sfx.no(); say(`要有寵物長到 ${r.lv} 級，才能打開${r.n}喔`); return; }
    S.room=r.id; save(); sfx.pop(); pet(); },
  petRm(b){ removeAsk=b.dataset.k; settings(); },
  petRmNo(){ removeAsk=''; settings(); },
  petRmYes(b){ const k=b.dataset.k; S.pets=S.pets.filter(p=>p.kind!==k); if(S.partner===k) S.partner=S.pets[0]?S.pets[0].kind:''; removeAsk=''; save(); settings(); },
  petTap(b,e){
    const p=P(); p.happy=Math.min(100,p.happy+3);
    const x=e.clientX||centerOf(b)[0], y=e.clientY||centerOf(b)[1];
    floatAt(pick(['💗','💕','💖']),x,y); sfx.pop();
    ACT.petTap.n=(ACT.petTap.n||0)+1;
    if(ACT.petTap.n%3===0){ const t=pick(['好舒服～','嘻嘻，好癢！','我好喜歡你！']); say(t); bubble(t); }
    petRefresh('happy','wig');
  },
  feed(b){
    const f=FOODS[+b.dataset.i], p=P();
    if(S.stars<f.p) return needStars();
    if(p.full>=100){ say('我吃好飽了，等一下再吃！'); bubble('我吃好飽了！'); return; }
    addStars(-f.p, b); flyTo(f.e,b,$('#pet'));
    p.full=Math.min(100,p.full+f.f); gainExp(f.x);
    setTimeout(()=>{ sfx.pop(); const t=`${f.n}好好吃！謝謝你！`; say(t); bubble(t); petRefresh('eat','nom'); },600);
  },
  play(b){
    const p=P(); if(S.stars<1) return needStars();
    if(p.happy>=100){ say('我玩得好開心，先休息一下！'); bubble('先休息一下！'); return; }
    addStars(-1,b); p.happy=Math.min(100,p.happy+25); gainExp(1);
    flyTo('⚽',b,$('#pet')); sfx.ok();
    const t='耶！好好玩！'; say(t); bubble(t); petRefresh('happy','jump');
  },
  bath(){
    const p=P(); p.happy=Math.min(100,p.happy+10);
    const r=$('#pet').getBoundingClientRect();
    for(let i=0;i<8;i++) setTimeout(()=>floatAt(pick(['🫧','💧','✨']), r.left+Math.random()*r.width, r.top+r.height*(.3+Math.random()*.5)), i*90);
    sfx.pop(); const t='洗得香香的！'; say(t); bubble(t); petRefresh('happy','wig');
  },
  acc(b){
    const a=ACCS.find(x=>x.id===b.dataset.id), p=P(); p.wear=p.wear||{};
    if(!accOpen(a)){
      if(a.lvl){ sfx.no(); say(`要有寵物長到 ${a.lvl} 級，才能得到${a.n}喔`); return; }
      if(S.stars<a.p) return needStars();
      addStars(-a.p,b); S.closet.push(a.id); p.wear[a.slot]=a.id; p.happy=Math.min(100,p.happy+10);
      sfx.win(); const t=`哇！我有${a.n}了！好看嗎？`; say(t); bubble(t); petRefresh('happy','jump'); return;
    }
    if(p.wear[a.slot]===a.id){ delete p.wear[a.slot]; say('先脫下來'); }
    else { p.wear[a.slot]=a.id; sfx.pop(); say(`戴上${a.n}！`); }
    petRefresh('happy','wig');
  }
};

  const b=e.target.closest('[data-act]'); if(!b) return;
  const f=ACT[b.dataset.act]; if(f) f(b,e);
});
document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});

applySkin();
loadClips().finally(()=>home());
